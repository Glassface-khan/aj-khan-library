name: THE WEIGHT OF PROOF GitHub Pages targeted rebuild
on:
  push:
    paths:
      - '.github/workflows/twop-pages-rebuild.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Verify Pages source, trigger rebuild if branch-backed, test public cover
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib,urllib.request,urllib.error,time
          repo=os.environ['GH_REPO']
          api='https://api.github.com/repos/'+repo+'/pages'
          t=os.environ['GH_TOKEN']
          report={'book':'THE WEIGHT OF PROOF','attempt':'targeted_pages_rebuild_20261104','cover_path':'assets/covers/the-weight-of-proof.png','authorized_epub_test':'NOT_TESTED_OWNER_AUTH_REQUIRED'}
          def api_call(url,method='GET'):
            request=urllib.request.Request(url,headers={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'AJK-Pages-Rebuild/1.0'},method=method)
            with urllib.request.urlopen(request,timeout=25) as r:
              return r.status,json.loads(r.read().decode('utf-8'))
          try:
            s,c=api_call(api)
            report['pages_config']={'build_type':c.get('build_type'),'source':c.get('source'),'status':c.get('status'),'html_url':c.get('html_url')}
            try:
              _,latest=api_call(api+'/builds/latest')
              report['latest_build_pre']={'status':latest.get('status'),'error':latest.get('error'),'created_at':latest.get('created_at'),'updated_at':latest.get('updated_at')}
            except Exception as err:
              report['latest_build_pre_error']=type(err).__name__+':'+str(err)[:140]
            source=c.get('source') or {}
            if False:  # diagnostic-only rerun: previous rebuild already accepted HTTP 201
              try:
                status,out=api_call(api+'/builds',method='POST')
                report['rebuild_trigger']='REQUESTED, HTTP '+str(status)
              except urllib.error.HTTPError as e:
                report['rebuild_trigger']='HTTP '+str(e.code)+' (no unsupported success claimed)'
            else:
              report['rebuild_trigger']='SKIPPED: source is not main root'
          except Exception as e:
            report['pages_config_error']=type(e).__name__+':'+str(e)[:140]
          url='https://glassface-khan.github.io/aj-khan-library/assets/covers/the-weight-of-proof.png?qa=twop-pages-20261104'
          attempts=[]
          for n in range(15):
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'AJK-Pages-Rebuild/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=25) as r:
                sig=r.read(8)
                size=r.headers.get('Content-Length','')
                ct=r.headers.get('Content-Type','')
                if r.status==200 and ct.startswith('image/') and sig==b'\x89PNG\r\n\x1a\n':
                  report['live_cover']='PASS'
                  report['live_content_type']=ct
                  report['live_content_length']=size
                  break
                attempts.append('HTTP '+str(r.status)+' '+ct)
            except urllib.error.HTTPError as e:
              attempts.append('HTTP '+str(e.code))
            except Exception as e:
              attempts.append(type(e).__name__)
            time.sleep(10)
          else:
            report['live_cover']='FAIL'
          try:
            _,latest2=api_call(api+'/builds/latest')
            report['latest_build_post']={'status':latest2.get('status'),'error':latest2.get('error'),'created_at':latest2.get('created_at'),'updated_at':latest2.get('updated_at')}
          except Exception as err:
            report['latest_build_post_error']=type(err).__name__+':'+str(err)[:140]
          report['attempts']=attempts
          dest=pathlib.Path('docs/publication/twop-pages-rebuild.json')
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in report.items() if k not in ('attempts',)},ensure_ascii=False))
          PY
      - name: Commit diagnostic only
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/publication/twop-pages-rebuild.json
          if ! git diff --cached --quiet; then
            git commit -m "Record THE WEIGHT OF PROOF Pages delivery check"
            git pull --rebase origin main
            git push origin main
          fi
