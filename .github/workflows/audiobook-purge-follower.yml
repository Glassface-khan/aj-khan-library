name: One-time Rejected FOLLOWER Audio Purge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audiobook-purge-follower.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  purge:
    name: Remove only two rejected FOLLOWER MP3 editions
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Acquire tightly scoped GitHub OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ajk-audiobook-factory")"
          printf '%s' "$RESPONSE" | jq -er '.value' > /tmp/follower-purge-token
      - name: Delete exactly two private author-rejected audio editions
        shell: bash
        run: |
          set -euo pipefail
          jq -n '{op:"workerPurgeRejectedFollowerAudio",confirm:"DELETE_TWO_REJECTED_FOLLOWER_AUDIO_EDITIONS"}' > /tmp/purge-request.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $(cat /tmp/follower-purge-token)" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/purge-request.json \
            "https://ipoqyjrojljmbqslmxxf.supabase.co/functions/v1/audiobook-factory" \
            > /tmp/follower-purge-result.json
          jq -e '.ok == true and .removedAudioFiles == 63 and .remainingAudioFiles == 0 and .originalsPreserved == true and .voiceReferencesPreserved == true' /tmp/follower-purge-result.json >/dev/null
          echo "FOLLOWER_AUDIO_STORAGE_PURGE=PASS; deleted 63 rejected chapter files; preserved manuscripts and voices."
      - name: Remove ephemeral credentials and report
        if: always()
        run: |
          rm -f /tmp/follower-purge-token /tmp/purge-request.json /tmp/follower-purge-result.json
