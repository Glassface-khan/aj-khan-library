name: Audiobook Queue Watcher

on:
  schedule:
    - cron: "2-57/5 * * * *"
    - cron: "4-59/5 * * * *"
  workflow_run:
    workflows: ["Audiobook Cloud Worker"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ajk-audiobook-queue-watcher
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  wake-worker:
    name: Wake audiobook worker when queue is non-empty
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check queue and dispatch worker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          attempts=1
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            attempts=5
          fi

          for attempt in $(seq 1 "$attempts"); do
            OIDC_JSON="$(curl --fail --silent --show-error               -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ajk-audiobook-factory")"
            OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value')"

            QUEUE_JSON="$(curl --fail --silent --show-error               -H "Authorization: Bearer $OIDC_TOKEN"               -H "Content-Type: application/json"               -d '{"op":"workerQueueStatus"}'               "https://ipoqyjrojljmbqslmxxf.supabase.co/functions/v1/audiobook-factory")"

            HAS_QUEUED="$(printf '%s' "$QUEUE_JSON" | jq -r '.hasQueued // false')"
            if [ "$HAS_QUEUED" = "true" ]; then
              RUNS_JSON="$(curl --fail --silent --show-error                 -H "Authorization: Bearer $GH_TOKEN"                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/audiobook-cloud-worker.yml/runs?per_page=20")"

              ACTIVE="$(printf '%s' "$RUNS_JSON" | jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length')"
              if [ "$ACTIVE" -eq 0 ]; then
                curl --fail --silent --show-error                   -X POST                   -H "Authorization: Bearer $GH_TOKEN"                   -H "Accept: application/vnd.github+json"                   -H "X-GitHub-Api-Version: 2022-11-28"                   "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/audiobook-cloud-worker.yml/dispatches"                   -d '{"ref":"main"}'
                echo "Queued audiobook found; worker dispatched."
              else
                echo "Queued audiobook found, but a worker run is already queued or in progress."
              fi
              exit 0
            fi

            if [ "$attempt" -lt "$attempts" ]; then
              sleep 15
            fi
          done

          echo "No queued audiobook job found."
