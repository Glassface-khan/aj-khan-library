name: Private Google Drive Migration Preflight
on:
  push:
    branches: ["prep/audio-drive-migration-2026-10-21"]
    paths:
      - "audiobook-cloud/drive_migration_preflight.py"
      - ".github/workflows/drive-migration-preflight.yml"
  pull_request:
    branches: [main]
    paths:
      - "audiobook-cloud/drive_migration_preflight.py"
      - ".github/workflows/drive-migration-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ajk-drive-migration-private-preflight
  cancel-in-progress: false
jobs:
  verify_private_drive:
    # Secrets in this private repository must remain inaccessible to forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing restricted Google Drive OAuth and readback
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: python3 audiobook-cloud/drive_migration_preflight.py
