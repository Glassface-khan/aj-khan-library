name: Audiobook Private Drive Backup
on:
  push:
    branches: [main]
    paths: ["audiobook-cloud/drive_backup_worker.py", ".github/workflows/audiobook-drive-backup.yml"]
  schedule:
    - cron: "4-59/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ajk-private-drive-backups
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Copy requested M4B files privately to Google Drive
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: python3 audiobook-cloud/drive_backup_worker.py
