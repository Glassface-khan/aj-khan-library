name: Patch live book refresh

on:
  push:
    paths:
      - 'tools/patch_live_books.js'
      - '.github/workflows/patch-live-books.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch bundled index
        run: node tools/patch_live_books.js
      - name: Use fresh live catalog requests and bump PWA generation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          for old in ('ajk-shell-v22','ajk-shell-v23','ajk-shell-v24'):
              s=s.replace(old, 'ajk-shell-v25')
          for old in ('ajk-data-v22','ajk-data-v23','ajk-data-v24'):
              s=s.replace(old, 'ajk-data-v25')
          s=s.replace("const CACHEABLE_GET_ACTIONS = new Set(['getBooks', 'getPoems', 'getSettings']);",
                      "const CACHEABLE_GET_ACTIONS = new Set(['getPoems', 'getSettings']);")
          extra="// v23 -> v25 (23.09.2026): current three-book catalog is a safe local fallback;\n// getBooks itself is never served from the service-worker data cache.\n"
          anchor="const SHELL_CACHE = 'ajk-shell-v25';"
          if extra not in s and anchor in s:
              s=s.replace(anchor, extra+anchor)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit result
        run: |
          if git diff --quiet -- index.html service-worker.js; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "Use safe current catalog fallback"
          git push
