name: AJK Private Auto M4B Backup
on:
  push:
    branches: [main]
    paths: [".github/workflows/ajk-private-auto-m4b-backup.yml"]
permissions:
  contents: read
  id-token: write
concurrency:
  group: ajk-private-auto-m4b-backups
  cancel-in-progress: false
jobs:
  backup-one:
    if: github.repository == 'Glassface-khan/aj-khan-library' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Back up one ready audiobook privately and verify readback
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: python3 -B ops/ajk_private_auto_m4b_backup.py
