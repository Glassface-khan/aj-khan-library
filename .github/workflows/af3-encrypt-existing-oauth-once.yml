name: AF3 encrypted one-time OAuth envelope ONLY (NO PLAINTEXT OUTPUT)
on:
  push:
    branches: [feature/af3-drive-token-readonly-20261030]
    paths: [.github/workflows/af3-encrypt-existing-oauth-once.yml]
permissions:
  contents: read
concurrency:
  group: af3-encrypt-existing-oauth-once
  cancel-in-progress: false
jobs:
  seal-verified-credentials:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Exact private Google originals and AES256-GCM CMS encryption; only ciphertext output
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          AF3_RECIPIENT_CERT_B64: ""
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "Glassface-khan/aj-khan-library" && "$GITHUB_REF" == "refs/heads/feature/af3-drive-token-readonly-20261030" ]] || exit 2
          python3 - <<'PY'
          import os,base64,json,urllib.request,urllib.error,urllib.parse,subprocess,re
          SCOPE="https://www.googleapis.com/auth/drive.file"
          ids={"false-scent":("1pWC09nFA95FlHUM9VNeBb-h1LyuFb_TB",328506009),
               "trembling-olive":("1XBpz5TTQGYhShwBzeeddQGEBsXNI7a7B",395220064)}
          keys=("GOOGLE_DRIVE_CLIENT_ID","GOOGLE_DRIVE_CLIENT_SECRET","GOOGLE_DRIVE_REFRESH_TOKEN")
          secrets={k:os.environ.get(k,"") for k in keys}
          if not all(secrets.values()):raise SystemExit("AF3_OAUTH_BRIDGE_FAILED_MISSING_SECRET")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*_):return None
          opener=urllib.request.build_opener(NoRedirect())
          data=urllib.parse.urlencode({
              "client_id":secrets[keys[0]],"client_secret":secrets[keys[1]],
              "refresh_token":secrets[keys[2]],"grant_type":"refresh_token"}).encode()
          try:
              req=urllib.request.Request("https://oauth2.googleapis.com/token",data=data,method="POST",headers={"Content-Type":"application/x-www-form-urlencoded"})
              with opener.open(req,timeout=22) as rsp:
                  assert rsp.status==200
                  token=json.loads(rsp.read(10000))
              assert set(token.get("scope","").split())=={SCOPE}
              access=token["access_token"]
              editions={}
              for slug,(fid,expected_size) in ids.items():
                  url="https://www.googleapis.com/drive/v3/files/"+urllib.parse.quote(fid,safe="")+"?fields=id,size,md5Checksum,version,mimeType,capabilities(canDownload)"
                  req=urllib.request.Request(url,headers={"Authorization":"Bearer "+access,"Accept":"application/json"},method="GET")
                  with opener.open(req,timeout=22) as rsp:
                      assert rsp.status==200
                      meta=json.loads(rsp.read(10000))
                  assert meta["id"]==fid and int(meta["size"])==expected_size
                  assert meta["mimeType"] in ("audio/x-m4b","audio/mp4")
                  assert meta["capabilities"]["canDownload"] is True
                  assert re.fullmatch("[0-9a-f]{32}",meta["md5Checksum"])
                  assert str(meta["version"]).isdecimal()
                  editions[slug]={"id":fid,"md5":meta["md5Checksum"],"version":str(meta["version"])}
              payload=json.dumps({"client_id":secrets[keys[0]],
                   "client_secret":secrets[keys[1]],
                   "refresh_token":secrets[keys[2]],
                   "editions":editions},separators=(",",":"),sort_keys=True).encode()
              cert=base64.b64decode(os.environ["AF3_RECIPIENT_CERT_B64"],validate=True)
              assert cert.startswith(b"-----BEGIN CERTIFICATE-----")
              import tempfile,pathlib
              with tempfile.TemporaryDirectory(prefix="af3-public-cert-") as tempdir:
                  cert_path=pathlib.Path(tempdir)/"recipient.crt"
                  cert_path.write_bytes(cert)
                  p=subprocess.run(["openssl","cms","-encrypt","-binary","-aes-256-gcm",
                       "-outform","DER",str(cert_path)],
                       input=payload,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=True)
              if not 400<len(p.stdout)<12000:raise ValueError("CMS envelope length")
              print("AF3_OAUTH_READONLY_METADATA_BOTH_PINS_MATCH=PASS")
              print("AF3_AES256_GCM_RSA3072_ENCRYPTION=PASS")
              print("AF3_TRANSFER_PLAINTEXT_IN_CODE_OR_LOGS=false")
              print("AF3_TRANSFER_ENVELOPE_B64="+base64.b64encode(p.stdout).decode("ascii"))
          except Exception:
              print("AF3_ENCRYPTED_TRANSFER=BLOCKED_SECURITY_GATE")
              raise SystemExit(2)
          PY
