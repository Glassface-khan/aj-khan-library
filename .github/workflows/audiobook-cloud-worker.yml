name: Audiobook Cloud Worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audiobook-cloud-worker.yml"
      - "audiobook-cloud/**"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ajk-audiobook-cloud-factory
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  claim:
    name: Check queue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_job: ${{ steps.claim.outputs.has_job }}
      job_id: ${{ steps.claim.outputs.job_id }}
    steps:
      - name: Claim one waiting audiobook job using GitHub OIDC
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail --silent --show-error             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ajk-audiobook-factory")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value')"
          curl --fail --silent --show-error             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             -d '{"op":"workerClaim"}'             "https://ipoqyjrojljmbqslmxxf.supabase.co/functions/v1/audiobook-factory"             > claim.json
          JOB_ID="$(jq -r '.job.id // empty' claim.json)"
          if [ -n "$JOB_ID" ]; then
            echo "has_job=true" >> "$GITHUB_OUTPUT"
            echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          else
            echo "has_job=false" >> "$GITHUB_OUTPUT"
            echo "job_id=" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    name: Pre-production QC
    needs: claim
    if: needs.claim.outputs.has_job == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    outputs:
      has_job: ${{ steps.prepare.outputs.has_job }}
      job_id: ${{ needs.claim.outputs.job_id }}
      shard_count: ${{ steps.prepare.outputs.shard_count }}
    steps:
      - name: Gate custom voice cloning before expensive setup
        id: hf_gate
        shell: bash
        run: |
          set -euo pipefail
          block_job() {
            local reason="$1"
            OIDC_JSON="$(curl --fail --silent --show-error               -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ajk-audiobook-factory")"
            OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value')"
            jq -n               --arg jobId "${{ needs.claim.outputs.job_id }}"               --arg reason "$reason"               '{op:"workerPreflightResult",jobId:$jobId,qcStatus:"failed",qcScore:0,qcSummary:{reasons:[$reason]},errorDetail:$reason,sections:[]}'               > /tmp/hf-block.json
            curl --fail --silent --show-error               -H "Authorization: Bearer $OIDC_TOKEN"               -H "Content-Type: application/json"               --data-binary @/tmp/hf-block.json               "https://ipoqyjrojljmbqslmxxf.supabase.co/functions/v1/audiobook-factory"               > /tmp/hf-block-response.json
            echo "continue=false" >> "$GITHUB_OUTPUT"
          }

          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::warning::HF_TOKEN repository secret is missing; custom voice cloning is blocked."
            block_job "HF_TOKEN is missing. Add the repository secret before using John D. or another cloned voice."
            exit 0
          fi

          code="$(curl -sS -o /tmp/hf-model.json -w '%{http_code}'             -H "Authorization: Bearer $HF_TOKEN"             "https://huggingface.co/api/models/kyutai/pocket-tts")"
          if [ "$code" != "200" ]; then
            echo "::warning::Hugging Face access to kyutai/pocket-tts is not available (HTTP $code)."
            block_job "Hugging Face access to kyutai/pocket-tts is not available. Accept the model terms and verify HF_TOKEN."
            exit 0
          fi

          echo "continue=true" >> "$GITHUB_OUTPUT"
          echo "HF_POCKET_TTS_ACCESS=PASS"

      - uses: actions/checkout@v4
        if: steps.hf_gate.outputs.continue == 'true'

      - uses: actions/setup-python@v5
        if: steps.hf_gate.outputs.continue == 'true'
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: audiobook-cloud/requirements.txt

      - name: Cache TTS and ASR model files only
        if: steps.hf_gate.outputs.continue == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: audiobook-models-${{ runner.os }}-pocket-tts-3.3.0-whisper-base-v1

      - name: System audio tools
        if: steps.hf_gate.outputs.continue == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1

      - name: Install CPU runtime
        if: steps.hf_gate.outputs.continue == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r audiobook-cloud/requirements.txt

      - name: Parse private manuscript and run pre-production quality gate
        if: steps.hf_gate.outputs.continue == 'true'
        id: prepare
        run: |
          python audiobook-cloud/worker.py prepare             --job-id "${{ needs.claim.outputs.job_id }}"             --workdir prepared             --shard-count 4

  produce:
    name: Produce + validate shard ${{ matrix.shard }}
    needs: [claim, prepare]
    if: needs.prepare.outputs.has_job == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: audiobook-cloud/requirements.txt

      - name: Restore TTS and ASR model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: audiobook-models-${{ runner.os }}-pocket-tts-3.3.0-whisper-base-v1

      - name: System audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1

      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r audiobook-cloud/requirements.txt

      - name: Produce assigned sections from private Supabase source
        run: |
          python audiobook-cloud/worker.py produce             --workdir prepared             --job-id "${{ needs.claim.outputs.job_id }}"             --shard-index "${{ matrix.shard }}"             --shard-count "${{ needs.prepare.outputs.shard_count }}"

  finalize:
    name: Final gate + publish
    needs: [claim, prepare, produce]
    if: always() && needs.claim.outputs.has_job == 'true' && needs.prepare.outputs.has_job == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight finalizer dependencies
        run: |
          python -m pip install "requests>=2.32,<3" "numpy>=2,<3" "soundfile>=0.13,<1"

      - name: Final QC gate and publish only if every section passed
        run: |
          python audiobook-cloud/worker.py finalize --job-id "${{ needs.claim.outputs.job_id }}"
