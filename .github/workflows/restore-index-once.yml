name: One-shot restore pre-inline-audio index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-index-once.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore index before duplicate inline audio patch
        run: git show 2cee9b735769b3b341f741c459575157b76d5df6:index.html > index.html
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/restore-index-once.yml
      - name: Commit clean result
        run: |
          git config user.name "AJ Khan Audio Integration"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/restore-index-once.yml
          git commit -m "Keep single audiobook library integration"
          git push
