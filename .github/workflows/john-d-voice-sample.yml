name: Audiobook Voice Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/john-d-voice-sample.yml"
      - "audiobook-cloud/voice_sample.py"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  sample:
    name: Render audiobook voice validation samples
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: audiobook-cloud/requirements.txt

      - name: Verify Pocket TTS gated access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          code="$(curl -sS -o /tmp/hf-model.json -w '%{http_code}'             -H "Authorization: Bearer $HF_TOKEN"             "https://huggingface.co/api/models/kyutai/pocket-tts")"
          test "$code" = "200"

      - name: System audio tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r audiobook-cloud/requirements.txt

      - name: Render isolated sample
        run: |
          cd audiobook-cloud
          python voice_sample.py             --job-id "3fd7f558-71df-4e3e-b120-960d13e85db0"             --section-index 1             --output-dir ../voice-sample

      - name: Upload private review sample
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-voice-validation
          path: voice-sample/THE_TESTIMONY_OF_SAND_CH01_*.mp3
          if-no-files-found: error
          retention-days: 1
