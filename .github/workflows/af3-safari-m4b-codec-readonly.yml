name: AF3 Safari silent M4B - bounded Drive container and codec metadata readback
on:
  push:
    branches: [feature/af3-drive-token-readonly-20261030]
    paths: [.github/workflows/af3-safari-m4b-codec-readonly.yml]
permissions:
  contents: read
jobs:
  inspect-existing-approved-m4b-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect MP4 atoms only with small private Drive byte ranges; no audio export
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "Glassface-khan/aj-khan-library" && "$GITHUB_REF" == "refs/heads/feature/af3-drive-token-readonly-20261030" ]] || exit 2
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,struct,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          result={"read_only":True,"no_original_mutation":True,"books":{}}
          keys=("GOOGLE_DRIVE_CLIENT_ID","GOOGLE_DRIVE_CLIENT_SECRET","GOOGLE_DRIVE_REFRESH_TOKEN")
          assert all(os.environ.get(k) for k in keys)
          data=urllib.parse.urlencode({"client_id":os.environ[keys[0]],"client_secret":os.environ[keys[1]],"refresh_token":os.environ[keys[2]],"grant_type":"refresh_token"}).encode()
          request=urllib.request.Request("https://oauth2.googleapis.com/token",data=data,headers={"Content-Type":"application/x-www-form-urlencoded"},method="POST")
          with urllib.request.urlopen(request,timeout=25) as r:
              assert r.status==200
              access=json.loads(r.read(8192))["access_token"]
          originals={"false-scent":("1pWC09nFA95FlHUM9VNeBb-h1LyuFb_TB",328506009),
                     "trembling-olive":("1XBpz5TTQGYhShwBzeeddQGEBsXNI7a7B",395220064)}
          def get(fid,size,start,count):
              assert 0<=start<size and 0<count<=262144 and start+count<=size
              url="https://www.googleapis.com/drive/v3/files/"+urllib.parse.quote(fid,safe="")+"?alt=media"
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+access,
                   "Range":f"bytes={start}-{start+count-1}"},method="GET")
              with urllib.request.urlopen(req,timeout=50) as r:
                  assert r.status==206 and r.headers.get("Content-Range")==f"bytes {start}-{start+count-1}/{size}"
                  b=r.read(count+1)
                  assert len(b)==count
                  return b
          for book,(fid,size) in originals.items():
              entry={}
              try:
                  first=get(fid,size,0,65536)
                  boxes=[]
                  pos=0
                  nextmoov=None
                  while pos+8<=len(first) and len(boxes)<12:
                      boxlen=struct.unpack_from(">I",first,pos)[0]
                      typ=first[pos+4:pos+8].decode("latin1")
                      if boxlen==1 and pos+16<=len(first):
                          boxlen=struct.unpack_from(">Q",first,pos+8)[0]
                      elif boxlen==0:
                          boxlen=size-pos
                      if not 8<=boxlen<=size-pos:break
                      boxes.append({"box":typ,"offset":pos,"bytes":boxlen})
                      if typ=="mdat":nextmoov=pos+boxlen
                      pos+=boxlen
                  entry["major_brand"]=first[8:12].decode("latin1","replace") if first[4:8]==b"ftyp" else "unrecognized"
                  entry["first_boxes"]=boxes
                  starts=[]
                  if nextmoov is not None and 0<nextmoov<size:starts.append(nextmoov)
                  starts.append(size-262144)
                  checks=[]
                  for start in dict.fromkeys(starts):
                      buf=get(fid,size,start,262144)
                      markers={typ:buf.find(typ.encode("latin1")) for typ in ["moov","mdat","stsd","mp4a",".mp3","alac","Opus","esds"]}
                      checks.append({"offset":start,"found":{k:start+v for k,v in markers.items() if v>=0}})
                  entry["codec_atom_markers"]=checks
                  entry["format_probe"]="PASS"
              except Exception as exc:
                  entry["format_probe"]="BLOCKED_"+type(exc).__name__
              result["books"][book]=entry
              print("AF3_SAFARI_FORMAT_"+book.upper().replace("-","_")+"="+entry["format_probe"])
              print("AF3_SAFARI_FIRST_BOXES_"+book.upper().replace("-","_")+"="+json.dumps(entry.get("first_boxes",[])))
              print("AF3_SAFARI_CODEC_MARKERS_"+book.upper().replace("-","_")+"="+json.dumps(entry.get("codec_atom_markers",[])))
          (root/"af3-safari-codec-metadata.json").write_text(json.dumps(result,indent=2))
          print("AF3_SAFARI_CODEC_READBACK_READ_ONLY=true")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: af3-m4b-atom-metadata-only
          path: ${{ runner.temp }}/af3-safari-codec-metadata.json
          retention-days: 1
          if-no-files-found: warn
