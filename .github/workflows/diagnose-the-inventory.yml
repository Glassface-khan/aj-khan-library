name: THE INVENTORY private author-site close probe

on:
  push:
    paths:
      - '.github/workflows/diagnose-the-inventory.yml'
      - 'books-live.json'
      - 'assets/covers/the-inventory.png'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify website, catalogue, image, and anonymous EPUB denial
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, urllib.parse, time, sys
          title = 'THE INVENTORY'
          root = 'https://glassface-khan.github.io/aj-khan-library/'
          backend = 'https://script.google.com/macros/s/AKfycbwcbRDaWkM1wf3MV_dj4RPw9jQl2Fgc4YfGcmFrGU1S243yvh8WGW7mbyXLbSeVJKI/exec'
          raw = pathlib.Path('books-live.json').read_text(encoding='utf-8')
          assert all(x not in raw for x in ('drive.google.com','docs.google.com','drive-private://')), 'Private Drive URI in public fallback'
          outer = json.loads(raw)
          books = json.loads(outer['books']) if isinstance(outer['books'], str) else outer['books']
          matches = [b for b in books if b.get('title') == title]
          assert len(matches) == 1, f'Expected exactly one website book, found {len(matches)}'
          book = matches[0]
          assert book.get('wordCount') == 100168 and book.get('chapterCount') == 40, 'Public book metadata mismatch'
          assert book.get('coverUrl') == 'assets/covers/the-inventory.png', 'Wrong cover URL'
          assert str(book.get('epubUrl','')).startswith('private-epub://'), 'EPUB is not a protected marker'
          img = pathlib.Path(book['coverUrl'])
          assert img.is_file() and img.read_bytes().startswith(b'\x89PNG\r\n\x1a\n'), 'Approved PNG missing or invalid'
          print('LOCAL_CATALOGUE=PASS')
          print('LOCAL_COVER_FILE=PASS')
          print('STATIC_PUBLIC_DRIVE_LEAK=NONE')

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent':'AJK-Inventory-Private-Book-Close/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, r.headers.get('Content-Type',''), r.read()

          url = root + book['coverUrl']
          result = None
          for attempt in range(8):
              try:
                  result = get(url+'?check=inventory-20261103')
                  if result[0] == 200 and result[1].startswith('image/') and result[2].startswith(b'\x89PNG\r\n\x1a\n'):
                      break
              except Exception as e:
                  print('COVER_RETRY', attempt+1, type(e).__name__)
              time.sleep(8)
          else:
              raise AssertionError('Live public cover still unavailable after retries')
          print('LIVE_COVER=PASS',len(result[2]))

          status,ctype,body = get(backend+'?action=getBooks')
          payload = json.loads(body.decode('utf-8'))
          live = json.loads(payload['books']) if isinstance(payload['books'],str) else payload['books']
          found = [b for b in live if b.get('title') == title]
          assert len(found) == 1, 'Live catalogue does not contain exactly one THE INVENTORY'
          remote = found[0]
          assert remote.get('wordCount') == 100168 and remote.get('chapterCount') == 40, 'Backend metadata mismatch'
          assert remote.get('coverUrl') == book['coverUrl'], 'Backend cover diverged from same-origin asset'
          assert str(remote.get('epubUrl','')).startswith('private-epub://'), 'Backend leaking EPUB URI'
          public = json.dumps(live,ensure_ascii=False)
          assert all(x not in public for x in ('drive.google.com','docs.google.com','drive-private://')), 'Live public Drive URI leak'
          print('LIVE_CATALOGUE=PASS count='+str(len(live)))

          q=urllib.parse.urlencode({'action':'getPrivateEpub','bookTitle':title,'langCode':'EN','intent':'read'})
          status,ctype,body = get(backend+'?'+q)
          denied=json.loads(body.decode('utf-8'))
          assert denied.get('ok') is not True, 'Critical: anonymous EPUB request succeeded'
          assert 'zugriff' in str(denied.get('error','')).lower(), 'Expected permission denied; got '+str(denied)[:250]
          print('ANONYMOUS_EPUB_DENIAL=PASS')
          print('AUTHORIZED_EPUB_OPEN=NOT_TESTED_REQUIRES_OWNER_LOGIN')
          print('INVENTORY_PUBLIC_WEB_PROBE=PASS')
          PY
