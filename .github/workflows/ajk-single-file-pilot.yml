name: AJK Private One-file Migration Pilot
on:
  push:
    branches: [main]
    paths: [".github/workflows/ajk-single-file-pilot.yml"]
permissions:
  contents: read
  id-token: write
concurrency:
  group: ajk-one-file-migration-pilot-20261023
  cancel-in-progress: false
jobs:
  one-file:
    if: github.repository == 'Glassface-khan/aj-khan-library' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify exactly one private audio object in app-owned Drive folder
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: python3 -B ops/ajk_single_file_pilot.py
