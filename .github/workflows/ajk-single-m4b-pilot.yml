name: AJK One-file Private M4B Pilot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ajk-single-m4b-pilot.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: ajk-isolated-one-file-m4b-20261023
  cancel-in-progress: false
jobs:
  pilot:
    if: github.event.head_commit.message == 'RUN ISOLATED PRIVATE 4MB PILOT ONCE'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Copy one verified source M4B to app-owned private Drive test folder
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys, urllib.parse, urllib.request
          
          SOURCE_GATEWAY = "https://ipoqyjrojljmbqslmxxf.supabase.co/functions/v1/ajk-single-m4b-pilot-source"
          SOURCE_PREFIX = "https://ipoqyjrojljmbqslmxxf.supabase.co/storage/v1/object/sign/audiobook-downloads/"
          TARGET_FOLDER = "1lrGlakIntgYvOz55bYSu7yTuYeJO9_Pp"
          NAME = "m4b-007.m4b"
          BYTES = 4744868
          SCOPE = "https://www.googleapis.com/auth/drive.file"
          DRIVE = "https://www.googleapis.com/drive/v3"
          UPLOAD = "https://www.googleapis.com/upload/drive/v3"
          SAFE_ERRORS = {
              "missing_existing_oauth", "oauth_scope_mismatch", "target_folder_inaccessible",
              "target_folder_not_private", "invalid_signed_source", "wrong_source_size",
              "duplicate_target_files", "existing_file_integrity_mismatch",
              "drive_upload_integrity_mismatch", "drive_readback_integrity_mismatch",
              "unexpected_upload_host", "source_gateway_rejected"
          }
          def fail(code):
              raise RuntimeError(code)
          def request(url, token=None, data=None, method=None, headers=None, timeout=90):
              h = dict(headers or {})
              if token:
                  h["Authorization"] = "Bearer " + token
              return urllib.request.urlopen(urllib.request.Request(url, data=data, method=method, headers=h), timeout=timeout)
          def json_api(url, token=None, data=None, method=None, headers=None):
              with request(url, token, data, method, headers) as rsp:
                  return json.load(rsp)
          def google_json(path, token, data=None, method=None):
              payload = None if data is None else json.dumps(data).encode()
              return json_api(DRIVE + path, token, payload, method, {"Content-Type": "application/json"})
          try:
              names = ("GOOGLE_DRIVE_CLIENT_ID", "GOOGLE_DRIVE_CLIENT_SECRET", "GOOGLE_DRIVE_REFRESH_TOKEN")
              if any(not os.getenv(k) for k in names):
                  fail("missing_existing_oauth")
              body = urllib.parse.urlencode({
                  "client_id": os.environ[names[0]], "client_secret": os.environ[names[1]],
                  "refresh_token": os.environ[names[2]], "grant_type": "refresh_token"
              }).encode()
              oauth = json_api("https://oauth2.googleapis.com/token", data=body, method="POST",
                               headers={"Content-Type": "application/x-www-form-urlencoded"})
              token = oauth["access_token"]
              if set(oauth.get("scope","").split()) != {SCOPE}:
                  fail("oauth_scope_mismatch")
              info = google_json("/files/" + TARGET_FOLDER + "?fields=id,mimeType,trashed", token)
              if info.get("id") != TARGET_FOLDER or info.get("trashed") or info.get("mimeType") != "application/vnd.google-apps.folder":
                  fail("target_folder_inaccessible")
              permissions = google_json("/files/" + TARGET_FOLDER + "/permissions?fields=permissions(type,role),nextPageToken", token)
              if permissions.get("nextPageToken") or any(p.get("type") != "user" for p in permissions.get("permissions", [])):
                  fail("target_folder_not_private")
              print("PASS: Existing OAuth works; app-owned private Drive test folder is accessible.", flush=True)
          
              # Fetch exactly one fixed private object: the gateway authenticates this specific workflow's GitHub OIDC.
              oidc_api = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=ajk-audiobook-factory"
              oidc = json_api(oidc_api, headers={"Authorization":"bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
              try:
                  signed = json_api(SOURCE_GATEWAY, token=oidc["value"], data=b"{}", method="POST",
                                    headers={"Content-Type":"application/json"})
              except Exception:
                  fail("source_gateway_rejected")
              if signed.get("ok") is not True or signed.get("name") != NAME or signed.get("bytes") != BYTES:
                  fail("source_gateway_rejected")
              source_url = signed.get("url","")
              if not source_url.startswith(SOURCE_PREFIX):
                  fail("invalid_signed_source")
              with request(source_url, timeout=120) as src:
                  payload = src.read(BYTES+1)
              if len(payload) != BYTES:
                  fail("wrong_source_size")
              md5 = hashlib.md5(payload).hexdigest()
              sha = hashlib.sha256(payload).hexdigest()
              print("PASS: Exactly one private source object read; 4,744,868 bytes.", flush=True)
          
              # Idempotency: never overwrite a different object and never create a duplicate on retries.
              q = "trashed = false and '" + TARGET_FOLDER + "' in parents and name = '" + NAME + "'"
              listing = google_json("/files?" + urllib.parse.urlencode({
                  "q":q, "fields":"nextPageToken,files(id,name,size,md5Checksum,parents)", "pageSize":"100"
              }), token)
              found = listing.get("files",[])
              if listing.get("nextPageToken") or len(found)>1:
                  fail("duplicate_target_files")
              if found:
                  existing = found[0]
                  if int(existing.get("size",-1)) != BYTES or existing.get("md5Checksum") != md5:
                      fail("existing_file_integrity_mismatch")
                  file_id=existing["id"]
                  print("INFO: Identical existing private file reused; no duplicate upload.", flush=True)
              else:
                  metadata = {
                      "name":NAME, "parents":[TARGET_FOLDER], "mimeType":"audio/mp4",
                      "appProperties":{"ajkIsolatedPilot":"single-m4b-007-20261023"}
                  }
                  init = request(UPLOAD + "/files?uploadType=resumable&fields=id,name,size,md5Checksum,parents",
                      token=token, data=json.dumps(metadata).encode(), method="POST",
                      headers={"Content-Type":"application/json", "X-Upload-Content-Type":"audio/mp4",
                               "X-Upload-Content-Length":str(BYTES)})
                  with init as rsp:
                      location = rsp.headers.get("Location","")
                  parsed = urllib.parse.urlparse(location)
                  if parsed.scheme!="https" or parsed.netloc!="www.googleapis.com" or not parsed.path.startswith("/upload/drive/v3/files"):
                      fail("unexpected_upload_host")
                  with request(location, token=token, data=payload, method="PUT",
                               headers={"Content-Type":"audio/mp4","Content-Length":str(BYTES)}, timeout=120) as rsp:
                      result = json.load(rsp)
                  if int(result.get("size",-1)) != BYTES or result.get("md5Checksum") != md5 or TARGET_FOLDER not in result.get("parents",[]):
                      fail("drive_upload_integrity_mismatch")
                  file_id = result["id"]
                  print("PASS: Exactly one new private M4B uploaded.", flush=True)
              verified = google_json("/files/"+urllib.parse.quote(file_id)+"?fields=id,name,size,md5Checksum,parents",token)
              if (verified.get("name")!=NAME or int(verified.get("size",-1))!=BYTES
                  or verified.get("md5Checksum")!=md5 or TARGET_FOLDER not in verified.get("parents",[])):
                  fail("drive_readback_integrity_mismatch")
              file_perms = google_json("/files/"+urllib.parse.quote(file_id)+"/permissions?fields=permissions(type,role),nextPageToken",token)
              if file_perms.get("nextPageToken") or any(p.get("type")!="user" for p in file_perms.get("permissions", [])):
                  fail("target_folder_not_private")
              with request(DRIVE+"/files/"+urllib.parse.quote(file_id)+"?alt=media",token, timeout=120) as rsp:
                  back=rsp.read(BYTES+1)
              if len(back)!=BYTES or hashlib.sha256(back).hexdigest()!=sha:
                  fail("drive_readback_integrity_mismatch")
              print("PILOT_PASS: SOURCE_AND_DRIVE_SHA256_MATCH",flush=True)
              print("Source and target bytes: 4744868",flush=True)
              print("SHA256: "+sha,flush=True)
              print("MD5: "+md5,flush=True)
              print("Private Drive file ID: "+file_id,flush=True)
              print("Destination private test folder ID: "+TARGET_FOLDER,flush=True)
              print("No source deletion. No factory queue claims. No public sharing.",flush=True)
          except Exception as exc:
              value = str(exc)
              print("PILOT_FAIL: " + (value if value in SAFE_ERRORS else "isolated_pilot_error"), flush=True)
              sys.exit(1)
          PY
