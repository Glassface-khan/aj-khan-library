name: One-Time Stop Failed German Narration

on:
  push:
    branches: [main]
    paths: [".github/workflows/one-time-stop-failed-german.yml"]

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Stop only the QC-failing DIE RÜCKFÜHRUNG run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/Glassface-khan/aj-khan-library/actions/runs/38151538567"
          json="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$url")"
          echo "$json" | jq -e '.name == "Audiobook Cloud Worker" and (.status == "in_progress" or .status == "queued")' >/dev/null
          code="$(curl --silent --show-error -o /tmp/cancel-out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$url/cancel")"
          test "$code" = "202" || { echo "Cancel rejected: HTTP $code"; exit 1; }
          echo "QC_FAILING_GERMAN_RUN_CANCEL_REQUESTED"
