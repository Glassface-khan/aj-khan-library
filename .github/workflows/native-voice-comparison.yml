name: Native Voice Comparison

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-voice-comparison.yml"
      - "audiobook-cloud/compare_native_voices.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  compare:
    name: Render native narrator samples
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: audiobook-cloud/requirements.txt
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r audiobook-cloud/requirements.txt
      - name: Render comparison
        working-directory: audiobook-cloud
        run: python compare_native_voices.py
      - name: Upload samples
        uses: actions/upload-artifact@v4
        with:
          name: native-pocket-tts-narrators
          path: audiobook-cloud/voice-comparison/*.wav
          if-no-files-found: error
          retention-days: 2
