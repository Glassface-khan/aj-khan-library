name: Inject audio library loader

on:
  push:
    paths:
      - "index.html"
      - "cover-grid-v3.js"
      - "audio-library.js"
      - ".github/workflows/inject-audio-library.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject audio-library.js loader
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          text = p.read_text(encoding="utf-8")
          audio_tag = '<script src="audio-library.js?v=20261006a" defer></script>'
          grid_tag = '<script src="cover-grid-v3.js?v=20261006a"></script>'
          # index.html contains an embedded template string with its own </body>.
          # Remove any previous runtime loaders and place BOTH current runtimes
          # before the LAST closing body tag, which is the real outer document body.
          import re
          text = re.sub(r'\s*<script src="audio-library\.js(?:\?[^"]*)?" defer></script>\s*', '\n', text)
          text = re.sub(r'\s*<script src="cover-grid-v3\.js(?:\?[^"]*)?"></script>\s*', '\n', text)
          pos = text.rfind("</body>")
          if pos < 0:
              raise SystemExit("index.html has no </body> tag")
          tags = "  " + grid_tag + "\n  " + audio_tag + "\n"
          text = text[:pos] + tags + text[pos:]
          p.write_text(text, encoding="utf-8")
      - name: Commit change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Loader already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load audiobook library player"
          git push
