name: Audio Factory - ZIP cleanup read-only gate (once)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/af-zip-readonly-check.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: af-zip-20261105-only
  cancel-in-progress: false
jobs:
  verify-only:
    if: >-
      github.repository == 'Glassface-khan/aj-khan-library' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, 'af-zip-readonly-check')
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify exact ZIP-only deletion scope (read-only)
        run: |
          python3 - <<'PY'
          import json,os,sys,urllib.request,urllib.parse
          AUD="ajk-zip-only-20261105-v1"
          EDGE="https://ipoqyjrojljmbqslmxxf.supabase.co/functions/v1/ajk-zip-only-cleanup-v1"
          try:
              u=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              parsed=urllib.parse.urlparse(u)
              assert parsed.scheme=="https" and parsed.hostname and parsed.hostname.endswith(".actions.githubusercontent.com")
              url=u+"&audience="+urllib.parse.quote(AUD)
              req=urllib.request.Request(url,headers={"Authorization":"bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
              with urllib.request.urlopen(req,timeout=25) as resp:
                  jwt=json.load(resp)["value"]
              data=json.dumps({"op":"check"}).encode()
              req=urllib.request.Request(EDGE,data=data,method="POST",headers={"Content-Type":"application/json","Authorization":"Bearer "+jwt})
              with urllib.request.urlopen(req,timeout=100) as resp:
                  out=json.load(resp)
              assert out.get("ok") is True and out.get("kind")=="read_only"
              assert out["remaining_zip"]==225 and out["remaining_bytes"]==8981464881
              assert isinstance(out.get("m4bs_in_25_folders"),int) and out["m4bs_in_25_folders"]>0
              print("AF_ZIP_READONLY_PASS zip=225 bytes=8981464881 m4b_guard_scope_present")
          except Exception:
              print("AF_ZIP_READONLY_BLOCKED_NO_DELETE")
              sys.exit(1)
          PY
