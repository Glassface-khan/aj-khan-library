name: Diagnose live book source

on:
  push:
    paths:
      - 'books-live.json'
      - 'BOOK_CLOSE_WORKFLOW.md'
      - '.github/workflows/diagnose-live-books.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose frontend, live backend, covers and EPUBs
        run: |
          python - <<'PY'
          import json,re,urllib.request,pathlib,sys,urllib.parse,base64
          p=pathlib.Path('index.html')
          s=p.read_text(encoding='utf-8',errors='replace')
          urls=sorted(set(re.findall(r'https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec',s)))
          out=[]
          failures=[]
          out.append('index_size='+str(len(s)))
          out.append('script_urls='+json.dumps(urls))

          def probe(url, expected, title):
              # The public book catalogue intentionally contains only
              # protected EPUB markers; the separate privacy-security
              # workflow tests that anonymous requests are denied.
              if expected == 'epub':
                  if not url:
                      return 'NOT_AVAILABLE|private_epub_not_linked'
                  if url.startswith('private-epub://'):
                      return 'AUTH_REQUIRED|anonymous_denial_checked_in_privacy_workflow'
                  failures.append(f'{title}: unsafe EPUB reference in public catalogue')
                  return 'UNSAFE_REFERENCE'

              if not url:
                  failures.append(f'{title}: missing public cover image')
                  return 'MISSING'

              if url.startswith('data:image/'):
                  try:
                      header, image_data = url.split(',', 1)
                      if ';base64' not in header:
                          raise ValueError('not a base64 data image')
                      blob = base64.b64decode(image_data, validate=True)
                      if not (blob.startswith(b'\xff\xd8') or blob.startswith(b'\x89PNG\r\n\x1a\n') or
                              (blob.startswith(b'RIFF') and blob[8:12] == b'WEBP') or blob.startswith(b'GIF8')):
                          raise ValueError('unknown image signature')
                      return 'embedded_public_image|ok=True'
                  except Exception as e:
                      failures.append(f'{title}: invalid embedded cover: {e!r}')
                      return 'BAD_DATA_IMAGE'

              if not url.startswith('assets/covers/') or '..' in pathlib.PurePosixPath(url).parts:
                  failures.append(f'{title}: cover is not a same-origin asset')
                  return 'UNSAFE_COVER_PATH'

              if not pathlib.Path(url).is_file():
                  failures.append(f'{title}: missing cover asset in repository: {url}')
                  return 'MISSING_ASSET'

              public_url = urllib.parse.urljoin(
                  'https://glassface-khan.github.io/aj-khan-library/', url)
              req = urllib.request.Request(public_url, headers={'User-Agent':'AJK-Live-Asset-Probe/2.0'})
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      status = getattr(response, 'status', 200)
                      ctype = (response.headers.get('Content-Type') or '').lower()
                      sample = response.read(64)
                  ok = status == 200 and ctype.startswith('image/') and len(sample) > 0
                  if not ok:
                      failures.append(f'{title}: cover response invalid, status={status}, type={ctype}')
                  return f'status={status}|type={ctype}|ok={ok}'
              except Exception as e:
                  failures.append(f'{title}: cover request failed: {e!r}')
                  return 'ERROR|'+repr(e)
          for u in urls:
              try:
                  with urllib.request.urlopen(u+'?action=getBooks', timeout=20) as r:
                      raw=r.read().decode('utf-8','replace')
                  data=json.loads(raw)
                  books=json.loads(data.get('books','[]')) if isinstance(data.get('books'),str) else data.get('books',[])
                  out.append('backend='+u)
                  out.append('book_count='+str(len(books)))
                  seen_titles=set()
                  for b in books:
                      title=str(b.get('title','')).strip()
                      out.append('BOOK|'+title+'|status='+str(b.get('status',''))+'|finished='+str(b.get('isFinished','')))
                      if not title:
                          failures.append('book with empty title')
                          continue
                      if title in seen_titles:
                          failures.append(title+': duplicate BooksData title')
                      seen_titles.add(title)
                      if b.get('isFinished'):
                          cover=probe(str(b.get('coverUrl','')), 'cover', title)
                          epub=probe(str(b.get('epubUrl','')), 'epub', title)
                          out.append('ASSET|'+title+'|cover|'+cover)
                          out.append('ASSET|'+title+'|epub|'+epub)
              except Exception as e:
                  failures.append('backend_error='+u+'|'+repr(e))
                  out.append('backend_error='+u+'|'+repr(e))

          # Decode bundled source and retain relevant load/filter snippets.
          flow=[]
          tm=re.search(r'<script type="__bundler/template">([\s\S]*?)</script>',s,re.I)
          if tm:
              try:
                  decoded=json.loads(tm.group(1))
                  for term in ['ajk_author_books_draft','?action=getBooks','visitorVisibleBooks','visibleBooksSourceRaw','componentDidMount','persistBooks']:
                      start=0
                      n=0
                      while True:
                          i=decoded.find(term,start)
                          if i<0 or n>=4: break
                          flow.append('\n=== '+term+' #'+str(n+1)+' @ '+str(i)+' ===\n'+decoded[max(0,i-1200):min(len(decoded),i+2600)])
                          start=i+len(term); n+=1
              except Exception as e:
                  flow.append('template_decode_error='+repr(e))
          else:
              flow.append('template_tag_not_found')

          out.append('asset_failure_count='+str(len(failures)))
          for f in failures:
              out.append('FAIL|'+f)

          pathlib.Path('diagnostics').mkdir(exist_ok=True)
          pathlib.Path('diagnostics/live-books.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          pathlib.Path('diagnostics/frontend-flow.txt').write_text('\n'.join(flow)+'\n',encoding='utf-8')
          print('\n'.join(out))
          if failures:
              sys.exit(1)
          PY
      - name: Save diagnostic report as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-books-diagnostic
          path: |
            diagnostics/live-books.txt
            diagnostics/frontend-flow.txt
          if-no-files-found: warn
          retention-days: 14
