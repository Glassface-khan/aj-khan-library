name: AF3 Tailscale gateway - existing SSH credential presence only (NO DEPLOY)
on:
  push:
    branches: [feature/af3-drive-token-readonly-20261030]
    paths: [.github/workflows/af3-tailscale-ssh-secret-presence-readonly.yml]
permissions:
  contents: read
jobs:
  presence-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Test if existing private OAuth repo can use preexisting Oracle SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GOOGLE_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_REFRESH: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "Glassface-khan/aj-khan-library" ]] || exit 2
          [[ "$GITHUB_REF" == "refs/heads/feature/af3-drive-token-readonly-20261030" ]] || exit 2
          [[ -n "$SSH_KEY" ]] && echo "AF3_LIBRARY_ORACLE_SSH_SECRET_PRESENT=true" || echo "AF3_LIBRARY_ORACLE_SSH_SECRET_PRESENT=false"
          [[ -n "$GOOGLE_ID" && -n "$GOOGLE_SECRET" && -n "$GOOGLE_REFRESH" ]] && echo "AF3_LIBRARY_OAUTH_TRIPLE_PRESENT=true" || echo "AF3_LIBRARY_OAUTH_TRIPLE_PRESENT=false"
          echo "AF3_NO_NETWORK_NO_SECRET_OUTPUT_NO_DEPLOY=PASS"
