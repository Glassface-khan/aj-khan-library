name: Private Completed Audiobook Quality Audit

on:
  push:
    branches: [main, audit/legacy-readonly-two-books-20261030]
    paths:
      - ".github/workflows/audiobook-library-audit.yml"
      - "audiobook-cloud/audit_existing_audiobooks.py"
      - "audiobook-cloud/legacy_audio_qc_readonly_once.py"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: private-audiobook-catalog-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    name: Audio quality shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Obtain audit-only GitHub OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ajk-audiobook-factory" \
            | jq -er '.value' > /tmp/private-audit-oidc
      - name: Install ASR and audiobook parsing dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python -m pip install 'numpy>=2,<3' 'requests>=2.32,<3' 'soundfile>=0.13,<1' \
            'python-docx==1.2.0' 'rapidfuzz>=3.10,<4' 'faster-whisper==1.2.1' 'av>=14,<19'
      - name: Read-only audit of finished audio samples
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          export AUDIT_OIDC_TOKEN="$(cat /tmp/private-audit-oidc)"
          python audiobook-cloud/audit_existing_audiobooks.py --shard "$SHARD" --shards 8
      - name: Erase ephemeral audit credentials
        if: always()
        run: rm -f /tmp/private-audit-oidc

  guest_private_target_once:
    name: THE GUEST private app-owned Drive destination creation and ACL readback
    if: github.ref == 'refs/heads/audit/legacy-readonly-two-books-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Safely create or reuse only one THE GUEST Drive folder, private by default
        shell: bash
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "Glassface-khan/aj-khan-library" ]]
          [[ "$GITHUB_REF" == "refs/heads/audit/legacy-readonly-two-books-20261030" ]]
          python3 - <<'PY'
          import json,os,urllib.request,urllib.parse,urllib.error
          keys=("GOOGLE_DRIVE_CLIENT_ID","GOOGLE_DRIVE_CLIENT_SECRET","GOOGLE_DRIVE_REFRESH_TOKEN")
          if not all(os.getenv(k) for k in keys):raise SystemExit("OAUTH_NOT_CONFIGURED")
          data=urllib.parse.urlencode(dict(
              grant_type="refresh_token",refresh_token=os.getenv(keys[2]),
              client_id=os.getenv(keys[0]),client_secret=os.getenv(keys[1]))).encode()
          with urllib.request.urlopen(urllib.request.Request("https://oauth2.googleapis.com/token",data=data),timeout=30) as r:
              auth=json.load(r)
          if set(auth.get("scope","").split())!={"https://www.googleapis.com/auth/drive.file"}:
              raise SystemExit("DRIVE_OAUTH_SCOPE_NOT_LEAST_PRIVILEGE")
          token=auth["access_token"]
          base="https://www.googleapis.com/drive/v3"
          def call(url,body=None,method=None):
              headers={"Authorization":"Bearer "+token}
              payload=None
              if body is not None:
                  payload=json.dumps(body).encode()
                  headers["Content-Type"]="application/json"
              with urllib.request.urlopen(urllib.request.Request(url,data=payload,method=method,headers=headers),timeout=45) as r:
                  return json.load(r)
          key="ajkGuestRescueFolder"
          val="b_the_guest_v1"
          query="trashed = false and appProperties has { key = 'ajkGuestRescueFolder' and value = 'b_the_guest_v1' }"
          params=urllib.parse.urlencode({"q":query,"fields":"nextPageToken,files(id,name,mimeType,trashed,parents,appProperties)","pageSize":100})
          candidates=call(base+"/files?"+params)
          found=candidates.get("files",[])
          if candidates.get("nextPageToken") or len(found)>1:raise SystemExit("DUPLICATE_TARGET_FOLDER_REJECTED")
          created=False
          if not found:
              folder=call(base+"/files?fields=id,name,mimeType,parents",{
                  "name":"THE GUEST - Private Audiobook Backup",
                  "mimeType":"application/vnd.google-apps.folder",
                  "appProperties":{key:val}
              },"POST")
              created=True
          else:folder=found[0]
          fid=str(folder.get("id") or "")
          if len(fid)<20:raise SystemExit("INVALID_CREATED_FOLDER")
          meta=call(base+"/files/"+fid+"?fields=id,name,mimeType,trashed,appProperties")
          if (meta.get("id")!=fid or meta.get("trashed") or
                  meta.get("name")!="THE GUEST - Private Audiobook Backup" or
                  meta.get("mimeType")!="application/vnd.google-apps.folder" or
                  meta.get("appProperties",{}).get(key)!=val):
              raise SystemExit("TARGET_READBACK_MISMATCH")
          acl=call(base+"/files/"+fid+"/permissions?fields=permissions(type,role),nextPageToken")
          if (acl.get("nextPageToken") or not acl.get("permissions") or
              any(p.get("type")!="user" for p in acl["permissions"])):
              raise SystemExit("TARGET_NOT_PRIVATE")
          print("GUEST_PRIVATE_GITHUB_DRIVE_TARGET="+fid)
          print("GUEST_PRIVATE_GITHUB_DRIVE_TARGET_CREATED="+str(created).lower())
          print("GUEST_PRIVATE_GITHUB_DRIVE_TARGET_READBACK=PASS")
          PY
