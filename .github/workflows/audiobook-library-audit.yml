name: Private Completed Audiobook Quality Audit

on:
  push:
    branches: [main, audit/legacy-readonly-two-books-20261030]
    paths:
      - ".github/workflows/audiobook-library-audit.yml"
      - "audiobook-cloud/audit_existing_audiobooks.py"
      - "audiobook-cloud/legacy_audio_qc_readonly_once.py"
      - "audiobook-cloud/man_last_audio_qc_readonly_once.py"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: private-audiobook-catalog-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    name: Audio quality shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Obtain audit-only GitHub OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ajk-audiobook-factory" \
            | jq -er '.value' > /tmp/private-audit-oidc
      - name: Install ASR and audiobook parsing dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python -m pip install 'numpy>=2,<3' 'requests>=2.32,<3' 'soundfile>=0.13,<1' \
            'python-docx==1.2.0' 'rapidfuzz>=3.10,<4' 'faster-whisper==1.2.1' 'av>=14,<19'
      - name: Read-only audit of finished audio samples
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          export AUDIT_OIDC_TOKEN="$(cat /tmp/private-audit-oidc)"
          python audiobook-cloud/audit_existing_audiobooks.py --shard "$SHARD" --shards 8
      - name: Erase ephemeral audit credentials
        if: always()
        run: rm -f /tmp/private-audit-oidc

  last_man_48_track_private_qc:
    name: THE MAN THE WORLD FORGOT exact-source 48-MP3 read-only ASR QC
    if: github.ref == 'refs/heads/audit/legacy-readonly-two-books-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned private audiobook QC dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python -m pip install 'numpy>=2,<3' 'requests>=2.32,<3' 'soundfile>=0.13,<1' \
            'python-docx==1.2.0' 'rapidfuzz>=3.10,<4' 'faster-whisper==1.2.1' 'av>=14,<19'
      - name: OIDC-verified private original import and signed read-only chapter snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "Glassface-khan/aj-khan-library" ]]
          [[ "$GITHUB_REF" == "refs/heads/audit/legacy-readonly-two-books-20261030" ]]
          umask 077
          TOKEN="$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ajk-man-last-private-qc-20261030" \
            | jq -er '.value')"
          curl --fail --silent --show-error --max-time 85 \
            -X POST -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"op":"locked-source-readonly-snapshot"}' \
            "https://ipoqyjrojljmbqslmxxf.supabase.co/functions/v1/ajk-man-last-private-qc-once" \
            > /tmp/ajk_man_private_snapshot.json
          jq -e '.ok == true and .source_bytes == 3736790 and
            .source_sha256 == "10e279c192d271e0b36121c832ca18387c7b7887478ffcc1bbf94a35ee9a348a" and
            .book.id == "b4e3bde1-7d88-4a04-a68f-55ca249af0ce" and
            .book.voice_key == "peter_yearsley" and
            (.chapters | length == 48) and .audio_readonly == true and
            .no_synthesis == true and
            (.classification == "UPLOADED_AND_VERIFIED" or .classification == "ALREADY_VERIFIED")' \
            /tmp/ajk_man_private_snapshot.json >/dev/null
          chmod 600 /tmp/ajk_man_private_snapshot.json
          echo "LAST_MAN_ORIGINAL_PRIVATE_SHA256_READBACK=PASS"
      - name: Verify exactly 48 real narrative chapters without audio changes
        shell: bash
        run: |
          set -Eeuo pipefail
          python audiobook-cloud/man_last_audio_qc_readonly_once.py --source-probe
      - name: Read-only ASR against all 48 existing MP3 tracks
        shell: bash
        run: |
          set -Eeuo pipefail
          python audiobook-cloud/man_last_audio_qc_readonly_once.py
      - name: Erase private signed read-only URLs
        if: always()
        run: rm -f /tmp/ajk_man_private_snapshot.json
