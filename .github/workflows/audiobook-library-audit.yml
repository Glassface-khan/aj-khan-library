name: Private Completed Audiobook Quality Audit

on:
  push:
    branches: [main, audit/legacy-readonly-two-books-20261030]
    paths:
      - ".github/workflows/audiobook-library-audit.yml"
      - "audiobook-cloud/audit_existing_audiobooks.py"
      - "audiobook-cloud/legacy_audio_qc_readonly_once.py"
      - "audiobook-cloud/man_last_audio_qc_readonly_once.py"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: private-audiobook-catalog-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    name: Audio quality shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Obtain audit-only GitHub OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ajk-audiobook-factory" \
            | jq -er '.value' > /tmp/private-audit-oidc
      - name: Install ASR and audiobook parsing dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python -m pip install 'numpy>=2,<3' 'requests>=2.32,<3' 'soundfile>=0.13,<1' \
            'python-docx==1.2.0' 'rapidfuzz>=3.10,<4' 'faster-whisper==1.2.1' 'av>=14,<19'
      - name: Read-only audit of finished audio samples
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          export AUDIT_OIDC_TOKEN="$(cat /tmp/private-audit-oidc)"
          python audiobook-cloud/audit_existing_audiobooks.py --shard "$SHARD" --shards 8
      - name: Erase ephemeral audit credentials
        if: always()
        run: rm -f /tmp/private-audit-oidc

  last_one_book_enqueue_once:
    name: Queue only THE MAN THE WORLD FORGOT audited M4B and Drive backup
    if: ${{ false }}  # Old last-title enqueue permanently disabled
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Queue precisely one checked existing-audio title after pinned successful QC
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "Glassface-khan/aj-khan-library" ]]
          [[ "$GITHUB_REF" == "refs/heads/audit/legacy-readonly-two-books-20261030" ]]
          TOKEN="$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ajk-man-last-private-qc-20261030" | jq -er '.value')"
          RESULT="$(curl --fail --silent --show-error --max-time 45 \
            -X POST -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"op":"last-queue-existing-audio-backup"}' \
            "https://ipoqyjrojljmbqslmxxf.supabase.co/functions/v1/ajk-man-last-private-qc-once")"
          if [[ "$(printf '%s' "$RESULT" | jq -r '.ok')" != "true" ]]; then
            printf '%s' "$RESULT" | jq -r '"LAST_BOOK_PREFLIGHT_BLOCKED="+(.error // "unknown")'
            exit 2
          fi
          printf '%s' "$RESULT" | jq -e \
             '.ok == true and .state == "QUEUED_EXISTING_AUDIO_ONLY" and
              .book_id == "b4e3bde1-7d88-4a04-a68f-55ca249af0ce" and
              .folder_id == "1loeST6DXr7CsouRVKB5sz09W6TQFNgTy" and
              .mp3_count == 48 and .mp3_bytes == 283195392 and
              .source_sha256 == "10e279c192d271e0b36121c832ca18387c7b7887478ffcc1bbf94a35ee9a348a" and
              .no_synthesis == true and .no_overwrite == true and
              (.fingerprint | test("^[a-f0-9]{64}$")) and
              (.backup_job_id | test("^[0-9a-f-]{36}$")) and
              (.export_job_id | test("^[0-9a-f-]{36}$"))' >/dev/null
          printf '%s' "$RESULT" | jq -r '"LAST_BOOK_EXPORT_JOB="+.export_job_id,"LAST_BOOK_BACKUP_JOB="+.backup_job_id'
          echo "LAST_BOOK_EXISTING_AUDIO_MIGRATION_QUEUED=PASS"

  one_time_drive_duplicate_hash_audit:
    name: Three same-voice audiobook folder pairs — private MD5 readback only
    if: github.ref == 'refs/heads/audit/legacy-readonly-two-books-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Compare every M4B name, size and Drive MD5, no modifications
        shell: bash
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "Glassface-khan/aj-khan-library" ]]
          [[ "$GITHUB_REF" == "refs/heads/audit/legacy-readonly-two-books-20261030" ]]
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request,urllib.error,re
          KEYS=("GOOGLE_DRIVE_CLIENT_ID","GOOGLE_DRIVE_CLIENT_SECRET","GOOGLE_DRIVE_REFRESH_TOKEN")
          if not all(os.environ.get(k) for k in KEYS):raise SystemExit("DUPLICATE_AUDIT=BLOCKED_MISSING_OAUTH")
          payload=urllib.parse.urlencode(dict(grant_type="refresh_token",
             refresh_token=os.environ[KEYS[2]],client_id=os.environ[KEYS[0]],
             client_secret=os.environ[KEYS[1]])).encode("utf-8")
          with urllib.request.urlopen(urllib.request.Request(
            "https://oauth2.googleapis.com/token",data=payload),timeout=30) as r:
            token=json.load(r)["access_token"]
          base="https://www.googleapis.com/drive/v3/files"
          HEAD={"Authorization":"Bearer "+token}
          def api(path,params=None):
            url=base+"/"+path if path else base
            if params:url+="?"+urllib.parse.urlencode(params)
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=HEAD),
                timeout=35) as r:return json.load(r)
            except urllib.error.HTTPError as exc:
              print("DUPLICATE_AUDIT_ACCESS_HTTP="+str(exc.code),flush=True)
              raise SystemExit(3)
          pairs=[
            ("DIE ORDNUNG","Arne B.","1Mrk3LOuudkQXPrktjAB4eqsnzXuM3i6k",
              "1uethUqz6H91-FFRucTc5c0d1RJcVHv4Z",7),
            ("The Missing Cover","Peter Yearsley","1xm-7YnOVZmG9u1fDp-I-rkoVIekYB0vC",
              "1u01WRueZxOLWnWxJFf15E3WT-M1wWwM3",5),
            ("The Road it came by","Mike Jordan","1d-ZnkBRVaEEs7k_GmVNux3212W5pWjK3",
              "1KqVyQvkIQ05ZsNccqpQaNnmKpHflRM37",7),
          ]
          MAIN="1K5_z2WLTehhTrZXuzIHaF60j2zo8G7Ld"
          def get_folder(fid):
            x=api(fid,{"fields":"id,name,mimeType,parents,trashed,shared"})
            if (x.get("id")!=fid or x.get("trashed") or
                x.get("mimeType")!="application/vnd.google-apps.folder" or
                x.get("parents")!=[MAIN] or x.get("shared") is True):
              raise SystemExit("DUPLICATE_AUDIT_FOLDER_OR_PRIVATE_PARENT_MISMATCH")
            return x
          def get_files(fid):
            out={}
            page=None
            while True:
              args={"q":"'"+fid+"' in parents and trashed=false",
                 "fields":"nextPageToken,files(id,name,mimeType,size,md5Checksum,parents,trashed)",
                 "pageSize":100}
              if page:args["pageToken"]=page
              data=api("",args)
              for item in data.get("files",[]):
                name=item.get("name")
                if not re.fullmatch(r"m4b-\d{3}\.m4b",name or ""):
                  raise SystemExit("DUPLICATE_AUDIT_UNEXPECTED_NON_M4B")
                if (name in out or item.get("mimeType")!="audio/mp4" or
                    item.get("parents")!=[fid] or not item.get("md5Checksum") or
                    not re.fullmatch(r"[0-9a-f]{32}",item["md5Checksum"]) or
                    not item.get("size")):
                  raise SystemExit("DUPLICATE_AUDIT_UNVERIFIED_FILE_METADATA")
                out[name]={"size":int(item["size"]),"md5":item["md5Checksum"]}
              page=data.get("nextPageToken")
              if not page:break
            return out
          total=0
          for title,voice,canonical,duplicate,num in pairs:
            first=get_folder(canonical)
            second=get_folder(duplicate)
            if first["name"]!=second["name"]:
              raise SystemExit("DUPLICATE_AUDIT_DIFFERENT_SPEAKERS_OR_TITLES")
            if title.casefold() not in first["name"].casefold() or voice.casefold() not in first["name"].casefold():
              raise SystemExit("DUPLICATE_AUDIT_BOOK_OR_VOICE_MISMATCH")
            primary=get_files(canonical)
            copy=get_files(duplicate)
            same=(len(primary)==len(copy)==num and primary==copy)
            print("DUPLICATE_AUDIT_PAIR="+json.dumps({
              "book":title,"voice":voice,"canonical_folder":canonical,
              "candidate_folder":duplicate,"file_count":num,
              "total_bytes":sum(x["size"] for x in primary.values()),
              "size_md5_identical":same,"all_md5_available":True,
              "files":[{"name":k,"size":v["size"],"md5":v["md5"]}
                for k,v in sorted(primary.items())],
              "no_writes":True},sort_keys=True),flush=True)
            if not same:raise SystemExit("DUPLICATE_AUDIT_MD5_MISMATCH_NOT_SAFE_TO_DELETE")
            total+=sum(x["size"] for x in primary.values())
          print("DUPLICATE_AUDIT_FINAL="+json.dumps({
            "pairs_checked":len(pairs),"identical_file_copies":sum(p[-1] for p in pairs),
            "identical_copy_bytes":total,"all_three_pairs_identical":True,
            "no_writes_or_deletions":True},sort_keys=True),flush=True)
          PY
