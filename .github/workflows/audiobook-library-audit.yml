name: Private Completed Audiobook Quality Audit

on:
  push:
    branches: [main, audit/legacy-readonly-two-books-20261030]
    paths:
      - ".github/workflows/audiobook-library-audit.yml"
      - "audiobook-cloud/audit_existing_audiobooks.py"
      - "audiobook-cloud/legacy_audio_qc_readonly_once.py"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: private-audiobook-catalog-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    name: Audio quality shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Obtain audit-only GitHub OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ajk-audiobook-factory" \
            | jq -er '.value' > /tmp/private-audit-oidc
      - name: Install ASR and audiobook parsing dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python -m pip install 'numpy>=2,<3' 'requests>=2.32,<3' 'soundfile>=0.13,<1' \
            'python-docx==1.2.0' 'rapidfuzz>=3.10,<4' 'faster-whisper==1.2.1' 'av>=14,<19'
      - name: Read-only audit of finished audio samples
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          export AUDIT_OIDC_TOKEN="$(cat /tmp/private-audit-oidc)"
          python audiobook-cloud/audit_existing_audiobooks.py --shard "$SHARD" --shards 8
      - name: Erase ephemeral audit credentials
        if: always()
        run: rm -f /tmp/private-audit-oidc

  guest_target_readonly_probe:
    name: THE GUEST private backup-folder access probe (no writes)
    if: github.ref == 'refs/heads/audit/legacy-readonly-two-books-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Verify GitHub Drive OAuth can read exact private target
        shell: bash
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "Glassface-khan/aj-khan-library" ]]
          [[ "$GITHUB_REF" == "refs/heads/audit/legacy-readonly-two-books-20261030" ]]
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error
          keys=("GOOGLE_DRIVE_CLIENT_ID","GOOGLE_DRIVE_CLIENT_SECRET","GOOGLE_DRIVE_REFRESH_TOKEN")
          if not all(os.environ.get(k) for k in keys):
              raise SystemExit("GUEST_TARGET_PROBE=BLOCKED_MISSING_OAUTH")
          payload=urllib.parse.urlencode(dict(
              client_id=os.environ[keys[0]],client_secret=os.environ[keys[1]],
              refresh_token=os.environ[keys[2]],grant_type="refresh_token")).encode()
          with urllib.request.urlopen(urllib.request.Request(
              "https://oauth2.googleapis.com/token",data=payload),timeout=30) as resp:
              token=json.load(resp)["access_token"]
          folder="1uFZddqavLnqEXBtXE1bE8JjVrFomV1N9"
          api="https://www.googleapis.com/drive/v3/files/"
          def get(path):
              request=urllib.request.Request(api+path,headers={"Authorization":"Bearer "+token})
              with urllib.request.urlopen(request,timeout=35) as resp:return json.load(resp)
          try:
              meta=get(folder+"?fields=id,mimeType,trashed")
              if meta.get("id")!=folder or meta.get("trashed") or meta.get("mimeType")!="application/vnd.google-apps.folder":
                  raise SystemExit("GUEST_TARGET_PROBE=BLOCKED_METADATA_MISMATCH")
              acl=get(folder+"/permissions?fields=permissions(type,role),nextPageToken")
              if acl.get("nextPageToken") or any(p.get("type")!="user" for p in acl.get("permissions",[])):
                  raise SystemExit("GUEST_TARGET_PROBE=BLOCKED_BROAD_PERMISSIONS")
              print("GUEST_TARGET_PROBE=PASS_PRIVATE_OAUTH_FOLDER")
          except urllib.error.HTTPError as exc:
              print("GUEST_TARGET_PROBE=BLOCKED_HTTP_"+str(exc.code))
              raise SystemExit(2)
          PY
