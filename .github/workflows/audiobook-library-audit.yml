name: Private Completed Audiobook Quality Audit

on:
  push:
    branches: [main, audit/legacy-readonly-two-books-20261030]
    paths:
      - ".github/workflows/audiobook-library-audit.yml"
      - "audiobook-cloud/audit_existing_audiobooks.py"
      - "audiobook-cloud/legacy_audio_qc_readonly_once.py"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: private-audiobook-catalog-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    name: Audio quality shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Obtain audit-only GitHub OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ajk-audiobook-factory" \
            | jq -er '.value' > /tmp/private-audit-oidc
      - name: Install ASR and audiobook parsing dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python -m pip install 'numpy>=2,<3' 'requests>=2.32,<3' 'soundfile>=0.13,<1' \
            'python-docx==1.2.0' 'rapidfuzz>=3.10,<4' 'faster-whisper==1.2.1' 'av>=14,<19'
      - name: Read-only audit of finished audio samples
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          export AUDIT_OIDC_TOKEN="$(cat /tmp/private-audit-oidc)"
          python audiobook-cloud/audit_existing_audiobooks.py --shard "$SHARD" --shards 8
      - name: Erase ephemeral audit credentials
        if: always()
        run: rm -f /tmp/private-audit-oidc

  guest_resumable_session_probe:
    name: THE GUEST first-file Drive resumable session probe (no file bytes)
    if: github.ref == 'refs/heads/audit/legacy-readonly-two-books-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Test existing Drive M4B resumable session without uploading or overwriting
        shell: bash
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "Glassface-khan/aj-khan-library" ]]
          [[ "$GITHUB_REF" == "refs/heads/audit/legacy-readonly-two-books-20261030" ]]
          python3 - <<'PY'
          import json,os,urllib.request,urllib.parse,urllib.error
          keys=["GOOGLE_DRIVE_CLIENT_ID","GOOGLE_DRIVE_CLIENT_SECRET","GOOGLE_DRIVE_REFRESH_TOKEN"]
          if not all(os.getenv(k) for k in keys):raise SystemExit("GUEST_TEST_NO_GOOGLE_AUTH")
          data=urllib.parse.urlencode(dict(client_id=os.getenv(keys[0]),client_secret=os.getenv(keys[1]),
               refresh_token=os.getenv(keys[2]),grant_type="refresh_token")).encode()
          with urllib.request.urlopen(urllib.request.Request("https://oauth2.googleapis.com/token",data=data),timeout=30) as r:
              token=json.load(r)["access_token"]
          folder="1Vn6lY4Eyj1VyO0J8bPUjhStLzYcdeX94"
          url="https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,size,md5Checksum"
          body={"name":"m4b-001.m4b","parents":[folder],
                "appProperties":{"ajkBackupFile":"9b8e8520-4aa2-4337-aa61-5c3a10ce2a6f:7ca611867b5b29cd556d9aecc476bc27cb14ffaced3aca434da168f702a90d5a:m4b-001.m4b"}}
          req=urllib.request.Request(url,data=json.dumps(body).encode(),method="POST",headers={
            "Authorization":"Bearer "+token,"Content-Type":"application/json",
            "X-Upload-Content-Type":"audio/mp4","X-Upload-Content-Length":"30862368"})
          try:
              with urllib.request.urlopen(req,timeout=45) as r:
                  print("GUEST_RESUMABLE_INIT_HTTP="+str(r.status))
                  print("GUEST_RESUMABLE_LOCATION_PRESENT="+str(bool(r.headers.get("Location"))).lower())
          except urllib.error.HTTPError as e:
              print("GUEST_RESUMABLE_INIT_HTTP="+str(e.code))
              try:
                  err=json.loads(e.read(2048))
                  reasons=[x.get("reason","unknown") for x in err.get("error",{}).get("errors",[])]
                  print("GUEST_RESUMABLE_API_REASON="+",".join(str(x)[:65] for x in reasons[:3]))
              except Exception:
                  print("GUEST_RESUMABLE_API_REASON=unknown")
              raise SystemExit(2)
          PY
