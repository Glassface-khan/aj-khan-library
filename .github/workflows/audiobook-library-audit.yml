name: Private Completed Audiobook Quality Audit

on:
  push:
    branches: [main, audit/legacy-readonly-two-books-20261030]
    paths:
      - ".github/workflows/audiobook-library-audit.yml"
      - "audiobook-cloud/audit_existing_audiobooks.py"
      - "audiobook-cloud/legacy_audio_qc_readonly_once.py"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: private-audiobook-catalog-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    name: Audio quality shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Obtain audit-only GitHub OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ajk-audiobook-factory" \
            | jq -er '.value' > /tmp/private-audit-oidc
      - name: Install ASR and audiobook parsing dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python -m pip install 'numpy>=2,<3' 'requests>=2.32,<3' 'soundfile>=0.13,<1' \
            'python-docx==1.2.0' 'rapidfuzz>=3.10,<4' 'faster-whisper==1.2.1' 'av>=14,<19'
      - name: Read-only audit of finished audio samples
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          export AUDIT_OIDC_TOKEN="$(cat /tmp/private-audit-oidc)"
          python audiobook-cloud/audit_existing_audiobooks.py --shard "$SHARD" --shards 8
      - name: Erase ephemeral audit credentials
        if: always()
        run: rm -f /tmp/private-audit-oidc

  guest_backup_transport_readonly_probe:
    name: Diagnose existing M4B signed source and Drive target without uploads
    if: github.ref == 'refs/heads/audit/legacy-readonly-two-books-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - name: First M4B source range GET, identity and private folder readback only
        shell: bash
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "Glassface-khan/aj-khan-library" ]]
          [[ "$GITHUB_REF" == "refs/heads/audit/legacy-readonly-two-books-20261030" ]]
          TOKEN="$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ajk-guest-qc-private-source-20261030" \
            | jq -er '.value')"
          RESULT="$(curl --fail --silent --show-error --max-time 35 \
            -X POST -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"op":"guest-backup-source-readonly-probe"}' \
            "https://ipoqyjrojljmbqslmxxf.supabase.co/functions/v1/ajk-guest-qc-private-source-once")"
          printf '%s' "$RESULT" | jq -c '{ok,state,status,content_range_matches,content_length,source_name,no_writes,error}'
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error
          keys=("GOOGLE_DRIVE_CLIENT_ID","GOOGLE_DRIVE_CLIENT_SECRET","GOOGLE_DRIVE_REFRESH_TOKEN")
          if not all(os.getenv(x) for x in keys):raise SystemExit("GUEST_BACKUP_OAUTH_MISSING")
          payload=urllib.parse.urlencode(dict(
              client_id=os.getenv(keys[0]),client_secret=os.getenv(keys[1]),
              refresh_token=os.getenv(keys[2]),grant_type="refresh_token")).encode()
          with urllib.request.urlopen(urllib.request.Request("https://oauth2.googleapis.com/token",data=payload),timeout=30) as r:
              token=json.load(r)["access_token"]
          folder="1Vn6lY4Eyj1VyO0J8bPUjhStLzYcdeX94"
          target="https://www.googleapis.com/drive/v3/files/"+folder+"?fields=id,capabilities(canAddChildren),mimeType,trashed"
          req=urllib.request.Request(target,headers={"Authorization":"Bearer "+token})
          try:
              with urllib.request.urlopen(req,timeout=25) as r:response=json.load(r)
              print("GUEST_BACKUP_SUBFOLDER_READ_STATUS=200")
              print("GUEST_BACKUP_SUBFOLDER_CAN_ADD="+str(response.get("capabilities",{}).get("canAddChildren")).lower())
              print("GUEST_BACKUP_SUBFOLDER_IS_FOLDER="+str(response.get("mimeType")=="application/vnd.google-apps.folder").lower())
          except urllib.error.HTTPError as e:
              print("GUEST_BACKUP_SUBFOLDER_READ_STATUS="+str(e.code))
          req=urllib.request.Request("https://www.googleapis.com/drive/v3/about?fields=storageQuota",
                                  headers={"Authorization":"Bearer "+token})
          try:
              with urllib.request.urlopen(req,timeout=25) as r:data=json.load(r)
              q=data.get("storageQuota",{})
              print("GUEST_DRIVE_STORAGE_LIMIT="+str(q.get("limit","unknown")))
              print("GUEST_DRIVE_STORAGE_USAGE="+str(q.get("usage","unknown")))
          except urllib.error.HTTPError as e:
              print("GUEST_DRIVE_QUOTA_QUERY_HTTP="+str(e.code))
          PY
