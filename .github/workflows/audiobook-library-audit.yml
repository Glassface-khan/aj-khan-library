name: Private Completed Audiobook Quality Audit

on:
  push:
    branches: [main, audit/legacy-readonly-two-books-20261030]
    paths:
      - ".github/workflows/audiobook-library-audit.yml"
      - "audiobook-cloud/audit_existing_audiobooks.py"
      - "audiobook-cloud/legacy_audio_qc_readonly_once.py"
      - "audiobook-cloud/man_last_audio_qc_readonly_once.py"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: private-audiobook-catalog-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    name: Audio quality shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Obtain audit-only GitHub OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ajk-audiobook-factory" \
            | jq -er '.value' > /tmp/private-audit-oidc
      - name: Install ASR and audiobook parsing dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python -m pip install 'numpy>=2,<3' 'requests>=2.32,<3' 'soundfile>=0.13,<1' \
            'python-docx==1.2.0' 'rapidfuzz>=3.10,<4' 'faster-whisper==1.2.1' 'av>=14,<19'
      - name: Read-only audit of finished audio samples
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          export AUDIT_OIDC_TOKEN="$(cat /tmp/private-audit-oidc)"
          python audiobook-cloud/audit_existing_audiobooks.py --shard "$SHARD" --shards 8
      - name: Erase ephemeral audit credentials
        if: always()
        run: rm -f /tmp/private-audit-oidc

  man_last_private_drive_target_once:
    name: THE MAN THE WORLD FORGOT private Drive target preflight or new app-owned folder
    if: github.ref == 'refs/heads/audit/legacy-readonly-two-books-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Reuse private existing target if app can access it, otherwise privately create one
        shell: bash
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "Glassface-khan/aj-khan-library" ]]
          [[ "$GITHUB_REF" == "refs/heads/audit/legacy-readonly-two-books-20261030" ]]
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,urllib.parse
          keys=("GOOGLE_DRIVE_CLIENT_ID","GOOGLE_DRIVE_CLIENT_SECRET","GOOGLE_DRIVE_REFRESH_TOKEN")
          if not all(os.getenv(k) for k in keys):raise SystemExit("DRIVE_OAUTH_MISSING")
          body=urllib.parse.urlencode(dict(
             grant_type="refresh_token",refresh_token=os.getenv(keys[2]),
             client_id=os.getenv(keys[0]),client_secret=os.getenv(keys[1]))).encode()
          with urllib.request.urlopen(urllib.request.Request("https://oauth2.googleapis.com/token",data=body),timeout=25) as r:
              auth=json.load(r)
          if set(auth.get("scope","").split())!={"https://www.googleapis.com/auth/drive.file"}:
              raise SystemExit("DRIVE_SCOPE_NOT_LEAST_PRIVILEGE")
          token=auth["access_token"]
          base="https://www.googleapis.com/drive/v3"
          def call(url,body=None,method=None):
              headers={"Authorization":"Bearer "+token}
              payload=None
              if body is not None:
                  payload=json.dumps(body).encode()
                  headers["Content-Type"]="application/json"
              with urllib.request.urlopen(urllib.request.Request(url,data=payload,
                    method=method,headers=headers),timeout=40) as r:return json.load(r)
          def private(fid):
              info=call(base+"/files/"+fid+"?fields=id,mimeType,trashed")
              if (info.get("id")!=fid or info.get("trashed") or
                  info.get("mimeType")!="application/vnd.google-apps.folder"):
                  raise SystemExit("TARGET_METADATA_REJECTED")
              acl=call(base+"/files/"+fid+"/permissions?fields=permissions(type,role),nextPageToken")
              if (acl.get("nextPageToken") or not acl.get("permissions") or
                  any(p.get("type")!="user" for p in acl["permissions"])):
                  raise SystemExit("TARGET_BROAD_SHARING_REJECTED")
          existing_id="1MfxOi8eFJaBiMZeKK5womrfuv5x0NW2j"
          accessible=False
          try:
              private(existing_id)
              accessible=True
          except urllib.error.HTTPError as exc:
              if exc.code not in (403,404):raise
              print("MAN_LAST_EXISTING_TARGET_OAUTH_HTTP="+str(exc.code))
          if accessible:
              print("MAN_LAST_PRIVATE_TARGET_ID="+existing_id)
              print("MAN_LAST_PRIVATE_TARGET_ORIGIN=EXISTING")
              print("MAN_LAST_PRIVATE_TARGET_ACL_READBACK=PASS")
              raise SystemExit(0)
          key="ajkManLastTarget"
          val="b_the_man_the_world_forgot_v1"
          q="trashed = false and appProperties has { key = 'ajkManLastTarget' and value = 'b_the_man_the_world_forgot_v1' }"
          query=urllib.parse.urlencode({"q":q,"fields":"nextPageToken,files(id,name,mimeType,trashed,appProperties)","pageSize":100})
          found=call(base+"/files?"+query)
          files=found.get("files",[])
          if found.get("nextPageToken") or len(files)>1:raise SystemExit("AMBIGUOUS_EXISTING_APP_TARGET")
          if files:
              folder=files[0]
              origin="REUSED_APP_OWNED"
          else:
              folder=call(base+"/files?fields=id,name,mimeType,appProperties",{
                "name":"THE MAN THE WORLD FORGOT - Private Audiobook Backup",
                "mimeType":"application/vnd.google-apps.folder","appProperties":{key:val}},"POST")
              origin="NEW_APP_OWNED"
          fid=str(folder.get("id") or "")
          if len(fid)<20:raise SystemExit("INVALID_APP_OWNED_ID")
          private(fid)
          final=call(base+"/files/"+fid+"?fields=name,appProperties")
          if (final.get("name")!="THE MAN THE WORLD FORGOT - Private Audiobook Backup" or
              final.get("appProperties",{}).get(key)!=val):
              raise SystemExit("APP_OWNED_TARGET_MISMATCH")
          print("MAN_LAST_PRIVATE_TARGET_ID="+fid)
          print("MAN_LAST_PRIVATE_TARGET_ORIGIN="+origin)
          print("MAN_LAST_PRIVATE_TARGET_ACL_READBACK=PASS")
          PY
