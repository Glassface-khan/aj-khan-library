name: Smoke The Testimony of Sand live card

on:
  push:
    paths:
      - '.github/workflows/smoke-the-low-wall.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Install Selenium
        run: python -m pip install --quiet selenium
      - name: Diagnose live visitor render
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          import time, json, sys

          SITE='https://glassface-khan.github.io/aj-khan-library/'
          TARGET='The Testimony of Sand'
          opt=Options()
          opt.add_argument('--headless=new')
          opt.add_argument('--no-sandbox')
          opt.add_argument('--disable-dev-shm-usage')
          opt.add_argument('--disable-gpu')
          opt.add_argument('--window-size=1440,1400')
          opt.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          d=webdriver.Chrome(options=opt)
          try:
              d.get(SITE)
              time.sleep(10)
              print('INITIAL_BODY=',repr(d.find_element(By.TAG_NAME,'body').text))
              print('BUTTONS=',d.execute_script("""
                return [...document.querySelectorAll('button,a')]
                  .map((el,i)=>({i,tag:el.tagName,text:(el.innerText||'').trim(),cls:el.className||'',id:el.id||''}))
                  .filter(x=>x.text).slice(0,120);
              """))

              clicked=d.execute_script("""
                const els=[...document.querySelectorAll('button,a,[role="button"]')];
                const el=els.find(e=>/^(books|bücher)$/i.test((e.innerText||'').trim()))
                  || els.find(e=>/(books|bücher)/i.test((e.innerText||'').trim()));
                if(!el) return null;
                el.click();
                return {tag:el.tagName,text:(el.innerText||'').trim(),id:el.id||'',cls:el.className||''};
              """)
              print('CLICKED=',clicked)
              time.sleep(5)

              body=d.find_element(By.TAG_NAME,'body').text
              source=d.page_source
              print('URL=',d.current_url)
              print('READY=',d.execute_script('return document.readyState'))
              print('BODY_HAS_TARGET=',TARGET in body)
              print('SOURCE_HAS_TARGET=',TARGET in source)
              print('BODY_LEN=',len(body))
              print('BODY_HEAD=',repr(body[:4000]))
              print('BOOK_CARD_COUNT=',d.execute_script("return document.querySelectorAll('[id^=book-card-]').length"))
              print('TARGET_ELEMENT_IDS=',d.execute_script("""
                const t=arguments[0];
                return [...document.querySelectorAll('[id^="book-card-"]')]
                  .filter(el => (el.innerText||'').includes(t))
                  .map(el => el.id);
              """, TARGET))
              print('LOCAL_BOOKS_HAS_TARGET=',d.execute_script("""
                try {
                  const x=JSON.parse(localStorage.getItem('ajk_author_books_draft')||'{}');
                  return Array.isArray(x.books) && x.books.some(b=>b && b.title===arguments[0]);
                } catch(e) { return String(e); }
              """, TARGET))
              print('FETCH_BOOKS_LIVE=', d.execute_async_script("""
                const target=arguments[0], done=arguments[1];
                fetch('books-live.json?_='+Date.now(),{cache:'no-store'})
                  .then(r=>r.json().then(j=>{
                    const raw=j.books;
                    const books=(typeof raw==='string')?JSON.parse(raw):raw;
                    done({status:r.status,count:Array.isArray(books)?books.length:null,has:Array.isArray(books)&&books.some(b=>b&&b.title===target)});
                  }))
                  .catch(e=>done({error:String(e)}));
              """, TARGET))
              print('BROWSER_LOGS=')
              for row in d.get_log('browser'):
                  print(json.dumps(row,ensure_ascii=False))
              if TARGET not in body:
                  sys.exit('TARGET_CARD_NOT_VISIBLE_AFTER_OPENING_BOOKS')
          finally:
              d.quit()
          PY
