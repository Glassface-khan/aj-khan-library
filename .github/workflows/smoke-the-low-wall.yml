name: Smoke The Low Wall live card

on:
  push:
    paths:
      - '.github/workflows/smoke-the-low-wall.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Install Selenium
        run: python -m pip install --quiet selenium
      - name: Diagnose live visitor render
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          import time, json

          SITE='https://glassface-khan.github.io/aj-khan-library/'
          opt=Options()
          opt.add_argument('--headless=new')
          opt.add_argument('--no-sandbox')
          opt.add_argument('--disable-dev-shm-usage')
          opt.add_argument('--disable-gpu')
          opt.add_argument('--window-size=1440,1200')
          opt.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          d=webdriver.Chrome(options=opt)
          try:
              d.get(SITE)
              time.sleep(12)
              print('URL=',d.current_url)
              print('TITLE=',repr(d.title))
              print('READY=',d.execute_script('return document.readyState'))
              body=d.find_element(By.TAG_NAME,'body').text
              print('BODY_REPR=',repr(body))
              print('BODY_HTML_LEN=',len(d.find_element(By.TAG_NAME,'body').get_attribute('innerHTML') or ''))
              print('PAGE_SOURCE_LEN=',len(d.page_source))
              print('ROOTS=',d.execute_script("""
                return [...document.body.children].map((el,i)=>({
                  i,tag:el.tagName,id:el.id||'',cls:el.className||'',
                  text:(el.innerText||'').slice(0,120),
                  html:(el.innerHTML||'').length,
                  display:getComputedStyle(el).display,
                  visibility:getComputedStyle(el).visibility
                }));
              """))
              print('SCRIPTS=',d.execute_script("""
                return [...document.scripts].map(s=>({src:s.src||'',type:s.type||'',len:(s.textContent||'').length}));
              """))
              print('BROWSER_LOGS=')
              for row in d.get_log('browser'):
                  print(json.dumps(row,ensure_ascii=False))
              print('HAS_LOW_WALL_SOURCE=', 'The Low Wall' in d.page_source)
              print('HAS_BOOKS_LIVE_MARKER=', 'AJK books-live fallback' in d.page_source)
              print('FETCH_BOOKS_LIVE=', d.execute_async_script("""
                const done=arguments[0];
                fetch('books-live.json?_='+Date.now(),{cache:'no-store'})
                  .then(r=>r.text().then(t=>done({status:r.status,len:t.length,has:t.includes('The Low Wall'),head:t.slice(0,120)})))
                  .catch(e=>done({error:String(e)}));
              """))
          finally:
              d.quit()
          PY

