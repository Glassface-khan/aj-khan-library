name: AF3 existing Cloudflare credentials - read-only check
on:
  push:
    branches:
      - feature/af3-drive-token-readonly-20261030
    paths:
      - .github/workflows/af3-existing-cloudflare-credentials-readonly.yml
permissions:
  contents: read
jobs:
  check-private-cloudflare-token-presence:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Test known secret names via read-only token verification, no tokens printed
        env:
          AJK_CLOUDFLARE_READONLY_TOKEN: ${{ secrets.AJK_CLOUDFLARE_READONLY_TOKEN }}
          AJK_CLOUDFLARE_V2_DEPLOY_TOKEN: ${{ secrets.AJK_CLOUDFLARE_V2_DEPLOY_TOKEN }}
          AJK_CLOUDFLARE_API_TOKEN: ${{ secrets.AJK_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AJK_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.AJK_CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "Glassface-khan/aj-khan-library" ]] || exit 2
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdr,url):return None
          client=urllib.request.build_opener(NoRedirect())
          for name in ("AJK_CLOUDFLARE_READONLY_TOKEN","AJK_CLOUDFLARE_V2_DEPLOY_TOKEN",
                           "AJK_CLOUDFLARE_API_TOKEN","CLOUDFLARE_API_TOKEN"):
              value=os.environ.get(name,"")
              print("AF3_"+name+"_PRESENT="+str(bool(value)).lower())
              if not value:continue
              req=urllib.request.Request("https://api.cloudflare.com/client/v4/user/tokens/verify",
                 headers={"Authorization":"Bearer "+value,"Accept":"application/json"})
              try:
                  with client.open(req,timeout=15) as rsp:data=json.load(rsp)
                  valid=(rsp.status==200 and data.get("success") is True
                         and data.get("result",{}).get("status")=="active")
                  print("AF3_"+name+"_ACTIVE="+str(valid).lower())
              except urllib.error.HTTPError as err:
                  print("AF3_"+name+"_VERIFY_HTTP="+str(err.code))
              except Exception:
                  print("AF3_"+name+"_VERIFY=UNAVAILABLE")
          for name in ("CLOUDFLARE_ACCOUNT_ID","AJK_CLOUDFLARE_ACCOUNT_ID"):
              print("AF3_"+name+"_PRESENT="+str(bool(os.environ.get(name))).lower())
          # Check existing account/workers/Access only through the NEW read-only token.
          # No names, account IDs, access tokens, emails or provider error bodies logged.
          token=os.environ.get("AJK_CLOUDFLARE_READONLY_TOKEN","")
          account=None
          if token:
              headers={"Authorization":"Bearer "+token,"Accept":"application/json"}
              def cf_read(path):
                  assert path.startswith("/accounts") and ".." not in path
                  try:
                      req=urllib.request.Request("https://api.cloudflare.com/client/v4"+path,
                          headers=headers,method="GET")
                      with client.open(req,timeout=20) as resp:
                          result=json.load(resp)
                      if resp.status!=200 or result.get("success") is not True:
                          return None,"INVALID"
                      return result.get("result"),"SUCCESS"
                  except urllib.error.HTTPError as err:
                      return None,"HTTP_"+str(err.code)
                  except Exception:
                      return None,"UNAVAILABLE"
              accounts,status=cf_read("/accounts?per_page=50")
              print("AF3_CLOUDFLARE_ACCOUNTS_READ="+status)
              if status=="SUCCESS" and isinstance(accounts,list):
                  print("AF3_CLOUDFLARE_ACCOUNT_COUNT="+str(len(accounts)))
                  if len(accounts)==1:
                      value=accounts[0].get("id","")
                      import re
                      if re.fullmatch("[0-9a-f]{32}",str(value)):
                          account=value
              if account:
                  scripts,status=cf_read("/accounts/"+account+"/workers/scripts?per_page=100")
                  print("AF3_CLOUDFLARE_WORKERS_READ="+status)
                  if status=="SUCCESS":
                      print("AF3_CLOUDFLARE_WORKERS_COUNT="+str(len(scripts) if isinstance(scripts,list) else "UNKNOWN"))
                  apps,status=cf_read("/accounts/"+account+"/access/apps?per_page=100")
                  print("AF3_CLOUDFLARE_ACCESS_APPS_READ="+status)
                  if status=="SUCCESS":
                      print("AF3_CLOUDFLARE_ACCESS_APPS_COUNT="+str(len(apps) if isinstance(apps,list) else "UNKNOWN"))
              else:
                  print("AF3_CLOUDFLARE_WORKERS_READ=BLOCKED_ACCOUNT_UNRESOLVED")
          print("AF3_CLOUDFLARE_PREFLIGHT=READ_ONLY_NO_SECRETS")
          PY
