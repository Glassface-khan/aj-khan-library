name: Arne German Voice Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arne-voice-validation.yml"
      - "audiobook-cloud/arne_voice_sample.py"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  validate-arne:
    name: Render Arne German validation sample
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: audiobook-cloud/requirements.txt

      - name: Verify Pocket TTS gated access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          code="$(curl -sS -o /tmp/hf-model.json -w '%{http_code}' \
            -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/api/models/kyutai/pocket-tts")"
          test "$code" = "200"

      - name: System audio tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r audiobook-cloud/requirements.txt

      - name: Render German validation
        run: |
          cd audiobook-cloud
          python arne_voice_sample.py --output-dir ../arne-validation

      - name: Upload Arne validation sample
        uses: actions/upload-artifact@v4
        with:
          name: arne-german-voice-validation
          path: arne-validation/ARNE_DE_VALIDATION.mp3
          if-no-files-found: error
          retention-days: 1
