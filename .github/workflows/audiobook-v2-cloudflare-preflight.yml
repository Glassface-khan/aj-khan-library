# AJK — SAFE, READ-ONLY Cloudflare preflight.
# This workflow is intentionally not an installer or deployment tool.
# It cannot create/change/delete Cloudflare resources or access audiobook files.
# Run only after its workflow has been reviewed and enabled on the default branch.
name: AJK V2 — Read-Only Cloudflare Connection Test

on:
  # One-off PR check: runs only if THIS verification workflow changes.
  # A fork does not receive secrets; fail closed if no secret exists.
  pull_request:
    paths:
      - ".github/workflows/audiobook-v2-cloudflare-preflight.yml"
  workflow_dispatch:
    inputs:
      account_id:
        description: "32-character Cloudflare Account ID (not a secret)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ajk-v2-cloudflare-readonly-preflight
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.AJK_CLOUDFLARE_READONLY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b5a96acb430918e9b39890a63f863349
    steps:
      - name: Checkout the reviewed repository
        uses: actions/checkout@v4
      - name: Validate existing bucket and database (read-only)
        run: python3 audiobook-factory-v2/scripts/cloudflare_readonly_preflight.py
