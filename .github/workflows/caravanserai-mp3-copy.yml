name: CARAVANSERAI fixed MP3 copy and full readback
on:
  push:
    branches: [ops/caravanserai-mp3-copy-20261028]
    paths: [ops/caravanserai-mp3-run.json]
permissions:
  contents: read
  id-token: write
concurrency:
  group: caravanserai-mp3-copy-20261028
  cancel-in-progress: false
jobs:
  copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Offline safety tests before accessing credentials
        run: python3 -B -m unittest discover -s tests -p test_caravanserai_mp3_backup.py -v
      - name: Verify existing file, pilot one MP3, then copy missing MP3s and read back every byte
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: python3 -B ops/caravanserai_mp3_backup.py
