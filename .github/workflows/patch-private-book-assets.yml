name: Patch private book asset routing

on:
  push:
    paths:
      - 'tools/patch_private_book_assets.js'
      - '.github/workflows/patch-private-book-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Route private book actions through protected backend
        run: node tools/patch_private_book_assets.js
      - name: Commit patched site
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Route private book actions through protected backend"
          git pull --rebase origin main
          git push
