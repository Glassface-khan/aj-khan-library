  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

9, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    :root{ --paper:#EEE7D8; --paper-deep:#E4DCC8; --ink:#211E1A; --ink-soft:#4A443B; --brass:#8C6A3E; --brass-soft:#B79A66; --indigo:#2C3B4C; --rule:#CFC3A4; }\n    *{box-sizing:border-box;}\n    body{margin:0;background:var(--paper);color:var(--ink);font-family:'Source Serif 4',serif;line-height:1.6;-webkit-font-smoothing:antialiased;}\n    a{color:var(--brass);}\n    input, textarea{font-family:'Source Serif 4',serif;}\n    input:focus, textarea:focus{outline:none;}\n    @keyframes draw{ to{ stroke-dashoffset:0; } }\n    .ink-stroke path{ fill:none; stroke:var(--brass); stroke-width:2; stroke-dasharray:900; stroke-dashoffset:900; animation:draw 2.2s ease-out .2s forwards; }\n    .cover-placeholder{\n      width:100%; aspect-ratio:2/3; display:flex; align-items:center; justify-content:center;\n      background:repeating-linear-gradient(45deg, var(--paper-deep), var(--paper-deep) 10px, var(--paper) 10px, var(--paper) 20px);\n      border:6px solid var(--paper-deep); outline:1px solid var(--rule); box-sizing:border-box;\n      font-family:monospace; font-size:11px; color:var(--ink-soft); text-align:center; padding:8px;\n    }\n    .cover-img{width:100%; aspect-ratio:2/3; object-fit:cover; border:6px solid var(--paper-deep); outline:1px solid var(--rule); box-sizing:border-box; filter:sepia(0.15) saturate(0.9);}\n  <\u002Fstyle>\n  <script id=\"library-data\" type=\"application/json\">\n  {\n    \"settings\": { \"viewerPassword\": \"family2026\", \"adminPassword\": \"khan-admin-2026\" },\n    \"books\": [\n      {\"id\":\"b1\",\"title\":\"Whoever Saves a Life\",\"tag\":\"Literary Fiction\",\"status\":\"Debut Novel\",\"hook\":\"Three windows, fourteen centuries apart — Aksum, Córdoba, Sarajevo — braided by two immortal witnesses to the cost of keeping a promise you never made.\",\"coverUrl\":\"\",\"altCovers\":[],\"background\":[],\"pdfUrl\":\"\",\"videoUrl\":\"\"},\n      {\"id\":\"b2\",\"title\":\"A Single Broken Letter\",\"tag\":\"Historical Thriller\",\"status\":\"Novel\",\"hook\":\"Baghdad, 833. A market-inspector must find the flaw in a corrupted sacred word before an eclipse — and a grieving woman's flawless argument for despair.\",\"coverUrl\":\"\",\"altCovers\":[],\"background\":[],\"pdfUrl\":\"\",\"videoUrl\":\"\"},\n      {\"id\":\"b3\",\"title\":\"The Weight of Words\",\"tag\":\"Historical Epic\",\"status\":\"Novel\",\"hook\":\"In the thirty years after the Prophet's death, a blind woman and a calligrapher become witnesses to how a fragile, hand-copied word is carried through conquest and civil war.\",\"coverUrl\":\"\",\"altCovers\":[],\"background\":[],\"pdfUrl\":\"\",\"videoUrl\":\"\"},\n      {\"id\":\"b4\",\"title\":\"Written in Water\",\"tag\":\"Literary Horror\",\"status\":\"Novel\",\"hook\":\"A city that freezes inner falsehood instead of punishing crime — and the one true, unwitnessed act that alone can open its gate.\",\"coverUrl\":\"\",\"altCovers\":[],\"background\":[],\"pdfUrl\":\"\",\"videoUrl\":\"\"},\n      {\"id\":\"b5\",\"title\":\"What the Clockmaker Kept\",\"tag\":\"Quiet Literary Fiction\",\"status\":\"Novel\",\"hook\":\"A Bosnian refugee repairs a broken music box every Thursday for two years — and teaches a grieving girl an entire ethic without ever explaining it.\",\"coverUrl\":\"\",\"altCovers\":[],\"background\":[],\"pdfUrl\":\"\",\"videoUrl\":\"\"},\n      {\"id\":\"b6\",\"title\":\"The Man the World Forgot\",\"tag\":\"Quiet Literary Fiction\",\"status\":\"Novel\",\"hook\":\"A village teacher dies believing he left nothing behind. An archivist finds otherwise — decades of hidden mercy, still quietly at work.\",\"coverUrl\":\"\",\"altCovers\":[],\"background\":[],\"pdfUrl\":\"\",\"videoUrl\":\"\"},\n      {\"id\":\"b7\",\"title\":\"The Missing Cover\",\"tag\":\"Narrative Nonfiction\",\"status\":\"Nonfiction\",\"hook\":\"The modern West keeps rediscovering a fourteen-hundred-year-old manual for living — fasting, sobriety, sleep, mindfulness — and calling it new.\",\"coverUrl\":\"\",\"altCovers\":[],\"background\":[],\"pdfUrl\":\"\",\"videoUrl\":\"\"},\n      {\"id\":\"b8\",\"title\":\"The Weight of Mercy\",\"tag\":\"Forthcoming\",\"status\":\"In Progress\",\"hook\":\"More soon.\",\"coverUrl\":\"\",\"altCovers\":[],\"background\":[],\"pdfUrl\":\"\",\"videoUrl\":\"\"}\n    ]\n  }\n  <\u002Fscript>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ unlocked }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"min-height:100vh; display:flex; flex-direction:column;\">\n\n    <div style=\"position:sticky; top:0; z-index:20; background:rgba(238,231,216,.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--rule); display:flex; align-items:center; justify-content:space-between; padding:16px 28px;\">\n      <div style=\"font-family:'Fraunces',serif; font-weight:500; font-size:19px; letter-spacing:.02em; color:var(--ink);\">A. J. <span style=\"color:var(--brass);\">Khan<\u002Fspan> <span style=\"color:var(--ink-soft); font-family:'Work Sans',sans-serif; font-size:12px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; margin-left:6px;\">Library<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:20px;\">\n        <sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n          <button style=\"background:transparent; border:1px solid var(--brass); color:var(--brass); font-family:'Work Sans',sans-serif; font-size:12px; letter-spacing:.06em; text-transform:uppercase; padding:9px 18px; cursor:pointer; white-space:nowrap;\" style-hover=\"background:var(--brass); color:var(--paper);\" sc-camel-on-click=\"{{ openManage }}\">Manage Library<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ true }}\">\n          <button style=\"background:none; border:none; color:var(--ink-soft); font-family:'Work Sans',sans-serif; font-size:12px; letter-spacing:.06em; text- lor:var(--ink);\" style-focus=\"border-color:var(--brass);\" value=\"{{ editForm.videoUrl }}\" sc-camel-on-change=\"{{ setVideo }}\"><\u002Fdiv>\n          <div style=\"display:flex; justify-content:flex-end; gap:10px; margin-top:8px;\">\n            <button type=\"button\" style=\"background:none; border:1px solid var(--rule); color:var(--ink-soft); font-family:'Work Sans',sans-serif; font-size:12px; letter-spacing:.06em; text-transform:uppercase; padding:9px 18px; cursor:pointer;\" style-hover=\"border-color:var(--brass); color:var(--brass);\" sc-camel-on-click=\"{{ closeForm }}\">Cancel<\u002Fbutton>\n            <button type=\"submit\" style=\"background:var(--ink); border:1px solid var(--ink); color:var(--paper); font-family:'Work Sans',sans-serif; font-size:12px; letter-spacing:.06em; text-transform:uppercase; padding:9px 18px; cursor:pointer;\" style-hover=\"background:var(--brass); border-color:var(--brass);\">Save<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fform>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showSettings }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; display:grid; place-items:center; padding:24px; background:rgba(44,59,76,0.55); z-index:50;\">\n      <div style=\"width:min(420px,100%); background:var(--paper); border:1px solid var(--rule); box-shadow:0 20px 48px rgba(33,30,26,0.25); padding:36px;\">\n        <form sc-camel-on-submit=\"{{ submitSettingsForm }}\" style=\"display:grid; gap:16px;\">\n          <h3 style=\"font-family:'Fraunces',serif; font-weight:500; font-size:22px; margin:0;\">Passwords<\u002Fh3>\n          <div><label style=\"display:block; font-family:'Work Sans',sans-serif; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px;\">Viewer password (family &amp; friends)<\u002Flabel><input style=\"width:100%; border:none; border-bottom:1px solid var(--rule); background:transparent; padding:8px 2px; font-size:15px; color:var(--ink);\" style-focus=\"border-color:var(--brass);\" value=\"{{ settingsForm.viewerPassword }}\" sc-camel-on-change=\"{{ setViewerPw }}\"><\u002Fdiv>\n          <div><label style=\"display:block; font-family:'Work Sans',sans-serif; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px;\">Admin password (managing the library)<\u002Flabel><input style=\"width:100%; border:none; border-bottom:1px solid var(--rule); background:transparent; padding:8px 2px; font-size:15px; color:var(--ink);\" style-focus=\"border-color:var(--brass);\" value=\"{{ settingsForm.adminPassword }}\" sc-camel-on-change=\"{{ setAdminPw }}\"><\u002Fdiv>\n          <div style=\"display:flex; justify-content:flex-end; gap:10px; margin-top:8px;\">\n            <button type=\"button\" style=\"background:none; border:1px solid var(--rule); color:var(--ink-soft); font-family:'Work Sans',sans-serif; font-size:12px; letter-spacing:.06em; text-transform:uppercase; padding:9px 18px; cursor:pointer;\" style-hover=\"border-color:var(--brass); color:var(--brass);\" sc-camel-on-click=\"{{ closeSettings }}\">Cancel<\u002Fbutton>\n            <button type=\"submit\" style=\"background:var(--ink); border:1px solid var(--ink); color:var(--paper); font-family:'Work Sans',sans-serif; font-size:12px; letter-spacing:.06em; text-transform:uppercase; padding:9px 18px; cursor:pointer;\" style-hover=\"background:var(--brass); border-color:var(--brass);\">Save<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fform>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showAdminLogin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; display:grid; place-items:center; padding:24px; background:rgba(44,59,76,0.55); z-index:50;\">\n      <div style=\"width:min(380px,100%); background:var(--paper); border:1px solid var(--rule); box-shadow:0 20px 48px rgba(33,30,26,0.25); padding:36px;\">\n        <form sc-camel-on-submit=\"{{ submitAdminLoginForm }}\" style=\"display:grid; gap:16px;\">\n          <h3 style=\"font-family:'Fraunces',serif; font-weight:500; font-size:22px; margin:0;\">Admin sign-in<\u002Fh3>\n          <div><label style=\"display:block; font-family:'Work Sans',sans-serif; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px;\">Admin password<\u002Flabel><input type=\"password\" style=\"width:100%; border:none; border-bottom:1px solid var(--rule); background:transparent; padding:8px 2px; font-size:15px; color:var(--ink);\" style-focus=\"border-color:var(--brass);\" value=\"{{ adminPasswordInput }}\" sc-camel-on-change=\"{{ setAdminPasswordInput }}\" autofocus=\"\"><\u002Fdiv>\n          <sc-if value=\"{{ adminError }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"color:#a13b2b; font-size:13px; margin:0;\">{{ adminError }}<\u002Fp>\n          <\u002Fsc-if>\n          <div style=\"display:flex; justify-content:flex-end; gap:10px;\">\n            <button type=\"button\" style=\"background:none; border:1px solid var(--rule); color:var(--ink-soft); font-family:'Work Sans',sans-serif; font-size:12px; letter-spacing:.06em; text-transform:uppercase; padding:9px 18px; cursor:pointer;\" style-hover=\"border-color:var(--brass); color:var(--brass);\" sc-camel-on-click=\"{{ closeAdminLogin }}\">Cancel<\u002Fbutton>\n            <button type=\"submit\" style=\"background:var(--ink); border:1px solid var(--ink); color:var(--paper); font-family:'Work Sans',sans-serif; font-size:12px; letter-spacing:.06em; text-transform:uppercase; padding:9px 18px; cursor:pointer;\" style-hover=\"background:var(--brass); border-color:var(--brass);\">Sign in<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fform>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fsc-if>\n\n<sc-if value=\"{{ locked }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;\">\n    <div style=\"width:min(420px,100%); text-align:center;\">\n      <span style=\"font-family:'Work Sans',sans-serif; font-weight:500; letter-spacing:.14em; text-transform:uppercase; font-size:12px; color:var(--brass);\">Private Library<\u002Fspan>\n      <h1 style=\"font-family:'Fraunces',serif; font-weight:400; font-size:42px; margin:14px 0 0; letter-spacing:-.01em;\">A. J. <em style=\"font-style:italic; font-weight:300; color:var(--brass);\">Khan<\u002Fem><\u002Fh1>\n      <svg class=\"ink-stroke\" sc-camel-view-box=\"0 0 320 20\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:200px; height:20px; display:block; margin:14px auto 20px;\">\n        <path d=\"M4,10 C60,2 90,17 130,9 C170,2 200,16 240,7 C270,3 290,12 316,6\"><\u002Fpath>\n      <\u002Fsvg>\n      <p style=\"color:var(--ink-soft); margin-bottom:32px;\">Enter the shared password to view the shelf.<\u002Fp>\n      <form sc-camel-on-submit=\"{{ submitGateForm }}\" style=\"display:grid; gap:16px; text-align:left;\">\n        <input type=\"password\" placeholder=\"Password\" style=\"width:100%; border:none; border-bottom:1px solid var(--ink); background:transparent; padding:12px 4px; font-size:16px; color:var(--ink);\" style-focus=\"border-color:var(--brass);\" value=\"{{ passwordInput }}\" sc-camel-on-change=\"{{ setPasswordInput }}\" autofocus=\"\">\n        <sc-if value=\"{{ gateError }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"color:#a13b2b; font-size:13px; margin:0;\">{{ gateError }}<\u002Fp>\n        <\u002Fsc-if>\n        <button type=\"submit\" style=\"background:var(--ink); border:1px solid var(--ink); color:var(--paper); font-family:'Work Sans',sans-serif; font-size:13px; letter-spacing:.08em; text-transform:uppercase; padding:14px; cursor:pointer;\" style-hover=\"background:var(--brass); border-color:var(--brass);\">Enter<\u002Fbutton>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    unlocked: null,\n    books: [],\n    settings: { viewerPassword: 'family2026', adminPassword: 'khan-admin-2026' },\n    passwordInput: '',\n    gateError: '',\n    selectedBookId: null,\n    activeTab: 'read',\n    showManage: false,\n    showForm: false,\n    editForm: null,\n    showAdminLogin: false,\n    adminPasswordInput: '',\n    adminError: '',\n    showSettings: false,\n    settingsForm: null,\n    downloadMsg: ''\n  };\n\n  componentDidMount() {\n    document.addEventListener('contextmenu', (e) => e.preventDefault());\n    let seed = { books: [], settings: this.state.settings };\n    try {\n      const el = document.getElementById('library-data');\n      if (el) seed = JSON.parse(el.textContent);\n    } catch (e) {}\n    let draft = null;\n    try { draft = JSON.parse(localStorage.getItem('ajkhanlib_draft')); } catch (e) {}\n    const data = draft || seed;\n    const unlocked = localStorage.getItem('ajkhanlib_unlocked');\n    this.setState({\n      books: data.books || [],\n      settings: data.settings || this.state.settings,\n      unlocked: unlocked || null\n    });\n  }\n\n  persist() {\n    localStorage.setItem('ajkhanlib_draft', JSON.stringify({ books: this.state.books, settings: this.state.settings }));\n  }\n\n  stopClick = (e) => { e.stopPropagation(); };\n\n  setPasswordInput = (e) => this.setState({ passwordInput: e.target.value, gateError: '' });\n  submitGateForm = (e) => { e.preventDefault(); this.submitGate(); };\n  submitGate() {\n    const pw = this.state.passwordInput;\n    if (pw === this.state.settings.adminPassword) {\n      localStorage.setItem('ajkhanlib_unlocked', 'admin');\n      this.setState({ unlocked: 'admin', passwordInput: '', gateError: '' });\n    } else if (pw === this.state.settings.viewerPassword) {\n      localStorage.setItem('ajkhanlib_unlocked', 'viewer');\n      this.setState({ unlocked: 'viewer', passwordInput: '', gateError: '' });\n    } else {\n      this.setState({ gateError: 'Incorrect password.' });\n    }\n  }\n  signOut = () => {\n    localStorage.removeItem('ajkhanlib_unlocked');\n    this.setState({ unlocked: null, showManage: false, selectedBookId: null });\n  };\n\n  openBook = (id) => this.setState({ selectedBookId: id, activeTab: 'read' });\n  closeBook = () => this.setState({ selectedBookId: null });\n  setTab(t) { this.setState({ activeTab: t }); }\n\n  openManage = () => this.setState({ showManage: true, downloadMsg: '' });\n  closeManage = () => this.setState({ showManage: false });\n\n  emptyForm() {\n    return { id: null, title: '', tag: '', status: '', hook: '', coverUrl: '', altCoversText: '', backgroundText: '', pdfUrl: '', videoUrl: '' };\n  }\n  openAddForm = () => this.setState({ showForm: true, editForm: this.emptyForm() });\n  openEditForm(book) {\n    this.setState({\n      showForm: true,\n      editForm: {\n        id: book.id, title: book.title, tag: book.tag, status: book.status, hook: book.hook,\n        coverUrl: book.coverUrl || '',\n        altCoversText: (book.altCovers || []).join('\\n'),\n        backgroundText: (book.background || []).map(b => b.title + ' | ' + b.url).join('\\n'),\n        pdfUrl: book.pdfUrl || '', videoUrl: book.videoUrl || ''\n      }\n    });\n  }\n  closeForm = () => this.setState({ showForm: false, editForm: null });\n\n  setField(key, value) { this.setState(s => ({ editForm: { ...s.editForm, [key]: value } })); }\n  setTitle = (e) => this.setField('title', e.target.value);\n  setTag = (e) => this.setField('tag', e.target.value);\n  setStatus = (e) => this.setField('status', e.target.value);\n  setHook = (e) => this.setField('hook', e.target.value);\n  setCover = (e) => this.setField('coverUrl', e.target.value);\n  setAltCovers = (e) => this.setField('altCoversText', e.target.value);\n  setBackground = (e) => this.setField('backgroundText', e.target.value);\n  setPdf = (e) => this.setField('pdfUrl', e.target.value);\n  setVideo = (e) => this.setField('videoUrl', e.target.value);\n\n  submitBookForm = (e) => { e.preventDefault(); this.saveForm(); };\n  saveForm() {\n    const f = this.state.editForm;\n    if (!f.title.trim()) return;\n    const altCovers = f.altCoversText.split('\\n').map(s => s.trim()).filter(Boolean);\n    const background = f.backgroundText.split('\\n').map(s => s.trim()).filter(Boolean).map(line => {\n      const parts = line.split('|');\n      return { title: (parts[0] || '').trim(), url: (parts.slice(1).join('|') || '').trim() };\n    });\n    const book = {\n      id: f.id || ('b' + Date.now()), title: f.title.trim(), tag: f.tag.trim(), status: f.status.trim(),\n      hook: f.hook.trim(), coverUrl: f.coverUrl.trim(), altCovers, background,\n      pdfUrl: f.pdfUrl.trim(), videoUrl: f.videoUrl.trim()\n    };\n    this.setState(s => {\n      const exists = s.books.some(b => b.id === book.id);\n      const books = exists ? s.books.map(b => (b.id === book.id ? book : b)) : [...s.books, book];\n      return { books, showForm: false, editForm: null };\n    }, () => this.persist());\n  }\n\n  deleteBook(id) {\n    if (!window.confirm('Delete this book?')) return;\n    this.setState(s => ({\n      books: s.books.filter(b => b.id !== id),\n      selectedBookId: s.selectedBookId === id ? null : s.selectedBookId\n    }), () => this.persist());\n  }\n\n  openAdminLogin = () => this.setState({ showAdminLogin: true, adminPasswordInput: '', adminError: '' });\n  closeAdminLogin = () => this.setState({ showAdminLogin: false });\n  setAdminPasswordInput = (e) => this.setState({ adminPasswordInput: e.target.value, adminError: '' });\n  submitAdminLoginForm = (e) => { e.preventDefault(); this.submitAdminLogin(); };\n  submitAdminLogin() {\n    if (this.state.adminPasswordInput === this.state.settings.adminPassword) {\n      localStorage.setItem('ajkhanlib_unlocked', 'admin');\n      this.setState({ unlocked: 'admin', showAdminLogin: false, adminPasswordInput: '' });\n    } else {\n      this.setState({ adminError: 'Incorrect admin password.' });\n    }\n  }\n\n  openSettings = () => this.setState({\n    showSettings: true,\n    settingsForm: { viewerPassword: this.state.settings.viewerPassword, adminPassword: this.state.settings.adminPassword }\n  });\n  closeSettings = () => this.setState({ showSettings: false });\n  setViewerPw = (e) => this.setState(s => ({ settingsForm: { ...s.settingsForm, viewerPassword: e.target.value } }));\n  setAdminPw = (e) => this.setState(s => ({ settingsForm: { ...s.settingsForm, adminPassword: e.target.value } }));\n  submitSettingsForm = (e) => { e.preventDefault(); this.saveSettings(); };\n  saveSettings() {\n    this.setState(s => ({ settings: { ...s.settingsForm }, showSettings: false }), () => this.persist());\n  }\n\n  resetDraft = () => {\n    if (!window.confirm('Discard local changes and reload the published version?')) return;\n    localStorage.removeItem('ajkhanlib_draft');\n    window.location.reload();\n  };\n\n  downloadSite = () => {\n    const payload = JSON.stringify({ books: this.state.books, settings: this.state.settings }, null, 2);\n    const clone = document.documentElement.cloneNode(true);\n    const script = clone.querySelector('#library-data');\n    if (script) script.textContent = payload;\n    const html = '<!DOCTYPE html>\\n' + clone.outerHTML;\n    const blob = new Blob([html], { type: 'text/html' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url; a.download = 'aj-khan-library.html';\n    document.body.appendChild(a); a.click(); document.body.removeChild(a);\n    URL.revokeObjectURL(url);\n    this.setState({ downloadMsg: 'Downloaded — upload this file to your host to publish the changes.' });\n  };\n\n  tabStyle(active) {\n    return 'display:inline-flex; align-items:center; cursor:pointer; font-family:\\'Work Sans\\',sans-serif; font-size:12px; letter-spacing:.05em; text-transform:uppercase; padding-bottom:8px; color:' + (active ? '#8C6A3E' : '#4A443B') + '; border-bottom:2px solid ' + (active ? '#8C6A3E' : 'transparent') + ';';\n  }\n\n  renderVals() {\n    const s = this.state;\n    const books = (s.books || []).map(b => ({\n      ...b,\n      hasCover: !!b.coverUrl,\n      noCover: !b.coverUrl,\n      onOpen: () => this.openBook(b.id),\n      onEdit: () => this.openEditForm(b),\n      onDelete: () => this.deleteBook(b.id)\n    }));\n    const selectedBook = s.selectedBookId ? books.find(b => b.id === s.selectedBookId) : null;\n    const tabHandlers = {\n      read: () => this.setTab('read'),\n      alt: () => this.setTab('alt'),\n      bg: () => this.setTab('bg'),\n      video: () => this.setTab('video')\n    };\n    return {\n      unlocked: s.unlocked,\n      locked: !s.unlocked,\n      isAdmin: s.unlocked === 'admin',\n      passwordInput: s.passwordInput, gateError: s.gateError,\n      setPasswordInput: this.setPasswordInput, submitGateForm: this.submitGateForm,\n      books, bookCount: books.length,\n      selectedBook, tabHandlers,\n      isTabRead: s.activeTab === 'read', isTabAlt: s.activeTab === 'alt',\n      isTabBg: s.activeTab === 'bg', isTabVideo: s.activeTab === 'video',\n      tabReadStyle: this.tabStyle(s.activeTab === 'read'),\n      tabAltStyle: this.tabStyle(s.activeTab === 'alt'),\n      tabBgStyle: this.tabStyle(s.activeTab === 'bg'),\n      tabVideoStyle: this.tabStyle(s.activeTab === 'video'),\n      hasAlt: !!(selectedBook && selectedBook.altCovers && selectedBook.altCovers.length),\n      hasBg: !!(selectedBook && selectedBook.background && selectedBook.background.length),\n      hasPdf: !!(selectedBook && selectedBook.pdfUrl),\n      hasVideo: !!(selectedBook && selectedBook.videoUrl),\n      closeBook: this.closeBook, stopClick: this.stopClick,\n      showManage: s.showManage, openManage: this.openManage, closeManage: this.closeManage,\n      openAddForm: this.openAddForm, showForm: s.showForm, editForm: s.editForm,\n      formHeading: s.editForm && s.editForm.id ? 'Edit Book' : 'Add Book',\n      setTitle: this.setTitle, setTag: this.setTag, setStatus: this.setStatus, setHook: this.setHook,\n      setCover: this.setCover, setAltCovers: this.setAltCovers, setBackground: this.setBackground,\n      setPdf: this.setPdf, setVideo: this.setVideo, submitBookForm: this.submitBookForm, closeForm: this.closeForm,\n      showAdminLogin: s.showAdminLogin, openAdminLogin: this.openAdminLogin, closeAdminLogin: this.closeAdminLogin,\n      adminPasswordInput: s.adminPasswordInput, adminError: s.adminError,\n      setAdminPasswordInput: this.setAdminPasswordInput, submitAdminLoginForm: this.submitAdminLoginForm,\n      showSettings: s.showSettings, openSettings: this.openSettings, closeSettings: this.closeSettings,\n      settingsForm: s.settingsForm, setViewerPw: this.setViewerPw, setAdminPw: this.setAdminPw,\n      submitSettingsForm: this.submitSettingsForm,\n      resetDraft: this.resetDraft, downloadSite: this.downloadSite, downloadMsg: s.downloadMsg,\n      signOut: this.signOut\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
