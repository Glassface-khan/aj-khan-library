    <h1>Revision Agent</h1>
    <p class="sub chrome-font">Wendet die Constitution Improvement Instructions und die Leserlichkeits-Guideline automatisch, Kapitel für Kapitel, auf das Manuskript an. Straffung 15–30 %, Struktur/Theologie/Stimmen bleiben unverändert.</p>

<script>
(function(){

// ---------- SYSTEM PROMPT ----------
const SYSTEM_PROMPT = `Du bist ein Senior Fiction Line Editor für den Roman "The Covenant of Light — Book One: The Forgetting" von A. J. Khan (islamische eschatologische Fiction, englischsprachig). Du überarbeitest EINEN Abschnitt (Kapitel/Interlude/Prologue/Dream Fragment) gemäß den folgenden verbindlichen Regeln. Du triffst KEINE strukturellen Entscheidungen (keine Szenen streichen, keine Reihenfolge ändern, keine neuen Szenen erfinden) — nur Satz-, Absatz- und Formulierungsebene.

=== LEITPRINZIP ===
Nicht schöner schreiben — der Text ist bereits schön. Ziel: zugänglicher, klarer, weniger ermüdend, ohne die Seele zu vereinfachen.
- Vertraue dem Leser früher.
- Beende einen Gedanken, sobald seine Bedeutung emotional und inhaltlich angekommen ist.
- Verkürze nicht die Geschichte, sondern den Weg zur Wirkung.
- Bewahre Spiritualität, Mythologie, Atmosphäre und emotionale Tiefe vollständig.
- Straffungskorridor für diesen Abschnitt: {{TARGET}} (Richtwert, nicht mechanisch, nicht um jeden Preis — Qualität vor Prozentzahl).

=== DIAGNOSE: WAS ZU KORRIGIEREN IST ===
1. Bedeutungswiederholung: Aussage wird formuliert, dann variiert, metaphorisch erklärt, dann theologisch eingeordnet — nur die stärkste Fassung behalten.
2. Metaphernsättigung: mehrere Bildsysteme (Licht, Wärme, Musik, Wasser, Blumen, Garten, Stille, Drehung, Tiefe) gleichzeitig in einem Absatz — auf ein dominantes Bild pro Absatz reduzieren, höchstens ein unterstützendes Bild.
3. Reflexion nach bereits gelungener Szene: Erzähler erklärt, was Handlung und Bild schon gezeigt haben — Erklärung streichen, Bild/Szene/Emotion behalten.
4. Gleichbleibende Tonhöhe: fast jeder Absatz strebt nach maximaler Schönheit — Kontrast durch kürzere, schlichtere Sätze schaffen, besonders nach dichten Passagen.
5. Verzögerte Kerninformation: neue Information erscheint erst nach mehreren poetischen Umwegen — Beobachtung → Information → Emotion → EIN starkes Bild → Weiterbewegung. Nicht: Beobachtung → Metapher → zweite Metapher → Erklärung → dritte Metapher → Information.
6. Zu ähnliche Figurenregister — siehe Character Voice Constitution unten.

Prüffrage vor jeder Kürzung: Versteht der Leser den Gedanken bereits? Wenn ja: nicht erneut erklären, sondern weiterbewegen.

=== LESERLICHKEIT (satz-/absatzebene, direkt anwendbar) ===
- Leser-Erfahrungstest: In jedem Kapitel soll der Leser durchgehend mindestens eines erleben: Neugier, Vorfreude, Sorge, Staunen, Ungewissheit, Empathie, Spannung, Befriedigung. Reine Reflexion ohne eines dieser Elemente über mehrere Absätze hinweg braucht Auflockerung (Handlung, Sinneswahrnehmung, Dialog-Fragment, kurzer Satz).
- Metaphern-Dichte: ein dominantes Bild pro Absatz, höchstens ein weiteres unterstützendes Bild. Keine schöne Bildsprache entfernen — nur Bildkonkurrenz innerhalb desselben Absatzes reduzieren. Die mantraartige Wiederholung über das GESAMTE Kapitel hinweg ist ein Stilmerkmal und bleibt erhalten — es geht nur um Häufung INNERHALB eines Absatzes.
- Trust the Reader: Wenn eine Wahrheit bereits gezeigt wurde, keine nachträgliche Erklärung/Klarstellung/Zusammenfassung/Wiederholung anhängen. Reihenfolge: Zeigen → Verstehen lassen → Weitergehen. Nicht: Zeigen → Erklären → Klarstellen → Umformulieren → Zusammenfassen.
- Absatzstruktur/Satzrhythmus: lange, reflektierende Sätze sind eine Stärke und bleiben erhalten — aber sie gewinnen an Kraft, wenn kürzere Sätze als Kontrast folgen (z.B. nach mehreren langen Sätzen: ein sehr kurzer Satz von 2-5 Wörtern). Große Reflexionsblöcke in kleinere Absätze teilen, zentralen Gedanken eigenen Absatz geben.
- Nach einer prägnanten Pointe/Offenbarung keinen erklärenden Nachsatz anhängen, der keinen neuen Inhalt bringt.
- Drei nahezu gleichbedeutende Verben/Bilder nicht nebeneinander verwenden, sofern jedes keine neue Nuance beisteuert.

=== HARTE STILGRENZEN (Literary Constitution, nicht verhandelbar) ===
- Em-Dashes: höchstens 1 pro Absatz, höchstens 3 pro Seite (~500 Wörter). Überschüsse durch Kommas, Punkte oder Semikolons ersetzen.
- Hedging-Wörter (somewhat, perhaps, a little, seemed to, almost as if, in a way — u.ä.): höchstens 1 pro 500 Wörter.
- KI-Signalwörter (pivotal, tapestry, testament, intricate, delve, tapestried, ineffable u.ä. generisches "literarisches" Vokabular): praktisch nie verwenden.
- Konnektoren (however, moreover, furthermore, indeed am Satzanfang): höchstens 1 pro Kapitel.
- Niemals drei aufeinanderfolgende Sätze mit identischem Satzanfang oder nahezu identischer Satzlänge.

=== CHARACTER VOICE CONSTITUTION ===
Hana: intuitiv, empfänglich, klar, emotional unmittelbar. Erkennt Wahrheit vor der Analyse. Sprache weich, poetisch, aber einfacher als die Erzählerstimme. Bilder aus Nähe, Wärme, Ruhe, Fürsorge, Wahrnehmung.
Adel: analytisch, präzise, strukturiert, fragend. Zerlegt Wahrheit in Unterschiede, Grenzen, Ursachen, Widersprüche. Sprache schärfer, geordneter, kühler. Wiederkehrende Motive (seams, edges, counting, weight, questions) sparsam einsetzen.
Zarif: humorvoll, überraschend, warm, beweglich. Bringt Tempowechsel in dichte Passagen. Lebendiger, direkter, weniger feierlich. Komik transportiert Wahrheit, wird nie zu reinem comic relief.
Hilal: knapp, ruhig, gewichtig, autoritativ. Jeder wichtige Satz zitierfähig. Erklärt selten vollständig, öffnet einen Denkraum. Wirkung nicht durch Übererklärung abschwächen — Hilal NIE ausführlich erklären lassen.
Antagonistische Stimme: kalt, kontrolliert, geduldig, beinahe juristisch. Weniger lyrische Schönheit, mehr Präzision, Bilanzierung, Anspruch, Instrumentalisierung. Kontrast zur warmen Schöpfungssprache muss hörbar sein.
Praxistest: Wären die Sprecher auch ohne Dialog-Tags unterscheidbar?

=== UNVERHANDELBAR — NIEMALS KÜRZEN, ABSCHWÄCHEN ODER VERSCHIEBEN ===
Präexistenz der Seelen; der Covenant / das ursprüngliche gemeinsame "Yes"; Erinnerung und Vergessen als Grundbewegung; Liebe als Grundstruktur der Schöpfung; freier Wille und echte moralische Verantwortung; Hana und Adel als komplementäre, nicht austauschbare Seelen; islamische Symbolik und theologische Verankerung; Musik und Licht als kosmische Ausdrucksformen; Barmherzigkeit vor Leistung; Fragen als mögliche Form der Hinwendung (nicht als Versagen). Keine theologische Aussage darf vereinfacht werden, nur weil sie komplex ist — vereinfacht wird die VERMITTLUNG, nie die Philosophie.

=== SYMBOLIK — GRUNDFUNKTION KONSISTENT HALTEN ===
Light = Wahrheit/Erkenntnis/Wirklichkeit. Warmth = göttliche Nähe/Getragensein. Music = göttliche Ordnung/Resonanz/Beziehung. Garden = Bestimmung/Möglichkeit/Heimat. Chord = Komplementarität, nicht vorschnelle Romantik. Cold = Trennung/Stolz/Berechnung. Seam/Edge = Adels Erkenntnismodus. Ledger/Debt = moralische Fehlentwicklung durch Anspruch.

=== WAS NIEMALS GESCHEHEN DARF ===
Bildsprache zu generischer Fantasy-Prosa glätten. Spirituelle Erfahrung durch nüchterne Erklärung ersetzen. Hana zu passiv oder Adel zu bloß kalt machen. Zarifs Humor in bedeutungslose Albernheit verwandeln. Hilal ausführlich erklären lassen. Das Geheimnis der Welt vollständig rationalisieren. Den Covenant auf romantische Seelenverwandtschaft reduzieren. Koranische Verweise dekorativ statt bedeutungstragend behandeln. Ein pauschales Kürzungsziel über die Qualität einzelner Passagen stellen. Namen, Handlungsfakten oder Reihenfolge verändern.

=== ARBEITSWEISE ===
1. Bestimme in Gedanken die neue Information jedes Abschnitts.
2. Markiere Doppelungen, wähle die stärkste Formulierung.
3. Prüfe pro Absatz das Leitbild, entferne konkurrierende Bilder.
4. Streiche Erzählerkommentare, die nur bereits Gezeigtes erklären.
5. Schärfe Figurenstimmen.
6. Balanciere Rhythmus (kurze Sätze als Kontrast nach dichten Passagen).
7. Prüfe: Philosophie vollständig erhalten? Bedeutung erhalten? Schönheit erhalten?

=== AUSGABEFORMAT ===
Antworte AUSSCHLIESSLICH mit einem validen JSON-Objekt, keine Markdown-Codeblöcke, kein Text davor oder danach:
{"revised": "<vollständig überarbeiteter englischer Text des Abschnitts>", "changes": ["<kurzer Stichpunkt zur wichtigsten Änderung>", "<...>", "<3-6 Stichpunkte total, auf Deutsch, konkret>"], "words_after": <int>}
Der Text in "revised" bleibt Englisch (Originalsprache des Manuskripts). Die "changes"-Liste ist auf Deutsch.`;

// Target reduction guidance per section (from Constitution §8, Prologue–Chapter 10; default for the rest)
function targetFor(heading){
  const h = heading.toLowerCase();
  if(h.startsWith('prologue')) return '25–35% (Wiederholung des Suchgefühls reduzieren, Kernkonflikt früher setzen, stärkste Regen-/Kompassbilder bewahren)';
  if(h.startsWith('overture')) return '20–30% (Angst/Garten-Feuer-Gegensatz je einmal vollständig entfalten, Erklärungsschleifen kürzen)';
  if(h.startsWith('chapter one')) return '20–25% (being/warmth/holding/turning verdichten, Hanas Staunen stärken)';
  if(h.startsWith('chapter two')) return '20–25% (counting/seams nicht mehrfach erklären, Adels Stimme schärfen)';
  if(h.startsWith('chapter three')) return 'leicht, ~8–12% (Zarifs Ankunft/Humor schützen)';
  if(h.startsWith('chapter four')) return 'leicht, ~8–12% (Begegnung/chord-Motiv erhalten, Gegner präziser/kälter)';
  if(h.startsWith('chapter five')) return 'moderat, ~15–20% (Hilal nicht übererklären, Nachklang statt Ausdeutung)';
  if(h.startsWith('chapter six')) return 'leicht bis moderat, ~10–18% (Freundschaft echt lassen, Foreshadowing nicht doppelt absichern)';
  if(h.startsWith('chapter seven')) return 'minimal, ~5% (Zarif/Nuri-Humor fast unangetastet)';
  if(h.startsWith('chapter eight')) return '20–30% (grit/shoe/grievance/debt nicht mehrfach erzählen, Verschiebung in klaren Stufen)';
  if(h.startsWith('chapter nine')) return 'minimal, ~5% (nur Redundanz in Größen-/Stillness-Beschreibung)';
  if(h.startsWith('chapter ten')) return 'minimal, ~5% (Komik/Wahrheit bewahren, Adels Reaktion kürzer/schärfer)';
  if(h.startsWith('interlude')) return 'leicht, ~10–15% (Interludes sind bereits kompakt — nur Sättigung, keine Substanz kürzen)';
  if(h.startsWith('dream fragment')) return 'sehr leicht, ~5–10% (Traumlogik/Atmosphäre unbedingt bewahren)';
  return '15–25% (allgemeiner Leitkorridor, nicht mechanisch)';
}

// ---------- STATE ----------
const STORAGE_KEY = 'manuscript-state-v1';
let state = { sections: [], running: false };
let openIndex = null;

async function loadState(){
  try{
    const r = await window.storage.get(STORAGE_KEY, false);
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      if(parsed && Array.isArray(parsed.sections)) state = parsed;
    }
  }catch(e){ /* no state yet */ }
}
let saveTimer = null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }catch(e){ console.error('save failed', e); }
  }, 250);
}

// ---------- PARSING ----------
function parseManuscript(raw){
  const parts = raw.split(/^###SECTION:\s*(.+?)\s*###$/m);
  const sections = [];
  // parts[0] is preamble junk; then alternating heading, body
  for(let i=1;i<parts.length;i+=2){
    const heading = parts[i].trim();
    const body = (parts[i+1]||'').trim();
    if(!body) continue;
    sections.push({
      id: sections.length,
      heading,
      original: body,
      wordsOriginal: body.split(/\s+/).filter(Boolean).length,
      status: 'pending',
      revised: '',
      changes: [],
      wordsAfter: 0,
      error: ''
    });
  }
  return sections;
}

// ---------- API ----------
async function reviseSection(sec){
  const userMsg = `Abschnitt: "${sec.heading}"\nStraffungs-Richtwert für diesen Abschnitt: ${targetFor(sec.heading)}\n\n--- ORIGINALTEXT (Englisch) ---\n${sec.original}`;
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens: 6000,
      system: SYSTEM_PROMPT.replace('{{TARGET}}', targetFor(sec.heading)),
      messages:[{role:'user', content:userMsg}]
    })
  });
  const data = await resp.json();
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  if(!textBlock) throw new Error('Keine Textantwort erhalten.');
  let raw = textBlock.text.trim();
  raw = raw.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'');
  let parsed;
  try{ parsed = JSON.parse(raw); }
  catch(e){
    const m = raw.match(/\{[\s\S]*\}/);
    if(m) parsed = JSON.parse(m[0]);
    else throw new Error('Antwort konnte nicht als JSON gelesen werden.');
  }
  if(!parsed.revised) throw new Error('Kein "revised"-Feld in der Antwort.');
  return parsed;
}

// ---------- AGENT LOOP ----------
async function runAgent(){
  if(state.running) return;
  state.running = true;
  render();
  while(state.running){
    const next = state.sections.find(s=>s.status==='pending' || s.status==='error');
    if(!next) break;
    next.status = 'processing';
    render();
    try{
      const result = await reviseSection(next);
      next.revised = result.revised;
      next.changes = result.changes || [];
      next.wordsAfter = result.words_after || result.revised.split(/\s+/).filter(Boolean).length;
      next.status = 'done';
      next.error = '';
    }catch(e){
      next.status = 'error';
      next.error = e.message || String(e);
    }
    saveState();
    render();
    if(!state.running) break;
  }
  state.running = false;
  saveState();
  render();
}
function pauseAgent(){ state.running = false; render(); }
async function redoSection(id){
  const sec = state.sections.find(s=>s.id===id);
  if(!sec) return;
  sec.status = 'processing';
  render();
  try{
    const result = await reviseSection(sec);
    sec.revised = result.revised;
    sec.changes = result.changes || [];
    sec.wordsAfter = result.words_after || result.revised.split(/\s+/).filter(Boolean).length;
    sec.status = 'done';
    sec.error = '';
  }catch(e){
    sec.status = 'error';
    sec.error = e.message || String(e);
  }
  saveState();
  render();
}

// ---------- EXPORT ----------
function exportManuscript(){
  const lines = [];
  state.sections.forEach(s=>{
    lines.push(s.heading.toUpperCase());
    lines.push('');
    lines.push(s.status==='done' ? s.revised : s.original);
    lines.push('');
    lines.push('');
  });
  const blob = new Blob([lines.join('\n')], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Covenant_of_Light_Buch1_revised.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

// ---------- RENDER ----------
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  const intake = document.getElementById('intake');
  const controls = document.getElementById('controls');
  const list = document.getElementById('list');
  const footer = document.getElementById('footer');

  if(state.sections.length === 0){
    intake.style.display = 'block';
    intake.innerHTML = `
      <div class="row" style="justify-content:space-between;align-items:flex-start;">
        <div style="flex:1;min-width:260px;">
          <h4 class="chrome-font" style="margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);">Manuskript einfügen</h4>
          <p class="hint">Füge den vollständigen Text mit <code>###SECTION: Titel###</code>-Markern ein (aus dem bereitgestellten Export). Der Agent zerlegt automatisch in Kapitel und verarbeitet sie eines nach dem anderen.</p>
        </div>
      </div>
      <textarea id="raw-input" placeholder="###SECTION: Prologue — The Echo###
There is a particular kind of rain in that city...

###SECTION: Overture — Before the First of the Worlds###
..."></textarea>
      <div class="row" style="margin-top:12px;">
        <button class="btn" id="parse-btn">Manuskript parsen &amp; Agent vorbereiten</button>
      </div>
    `;
    controls.style.display = 'none';
    list.innerHTML = '';
    footer.style.display = 'none';
    document.getElementById('parse-btn').onclick = ()=>{
      const raw = document.getElementById('raw-input').value;
      const sections = parseManuscript(raw);
      if(sections.length === 0){
        alert('Keine ###SECTION:###-Marker gefunden. Bitte den bereitgestellten Export unverändert einfügen.');
        return;
      }
      state = { sections, running:false };
      saveState();
      render();
    };
    return;
  }

  intake.style.display = 'none';

  const total = state.sections.length;
  const done = state.sections.filter(s=>s.status==='done').length;
  const errored = state.sections.filter(s=>s.status==='error').length;
  const wordsOrig = state.sections.reduce((a,s)=>a+s.wordsOriginal,0);
  const wordsRevSoFar = state.sections.reduce((a,s)=>a + (s.status==='done' ? s.wordsAfter : s.wordsOriginal), 0);
  const pct = total ? Math.round((done/total)*100) : 0;
  const reduction = done>0 ? Math.round((1 - (state.sections.filter(s=>s.status==='done').reduce((a,s)=>a+s.wordsAfter,0) / state.sections.filter(s=>s.status==='done').reduce((a,s)=>a+s.wordsOriginal,0)))*100) : 0;

  controls.style.display = 'block';
  controls.innerHTML = `
    <div class="row" style="justify-content:space-between;">
      <div class="row">
        <button class="btn" id="run-btn" ${state.running?'disabled':''}>${done===total ? 'Fertig' : (state.running ? 'Agent läuft…' : (done>0||errored>0 ? 'Agent fortsetzen' : 'Agent starten'))}</button>
        <button class="btn ghost" id="pause-btn" ${state.running?'':'disabled'}>Pausieren</button>
        <button class="btn ghost" id="reset-btn">Neues Manuskript laden</button>
      </div>
    </div>
    <div class="progress-outer"><div class="progress-inner" style="width:${pct}%"></div></div>
    <div class="stats chrome-font">
      <span><b>${done}</b> / ${total} Abschnitte fertig</span>
      <span>${errored>0 ? `<b style="color:var(--error)">${errored} Fehler</b>` : ''}</span>
      <span>Wörter original: <b>${wordsOrig.toLocaleString('de-DE')}</b></span>
      <span>Ø Straffung (fertige Abschnitte): <b>${done>0?reduction+'%':'–'}</b></span>
    </div>
  `;
  document.getElementById('run-btn').onclick = runAgent;
  document.getElementById('pause-btn').onclick = pauseAgent;
  document.getElementById('reset-btn').onclick = ()=>{
    if(confirm('Aktuellen Fortschritt verwerfen und neues Manuskript laden?')){
      state = { sections: [], running:false };
      saveState();
      render();
    }
  };

  list.innerHTML = state.sections.map((s)=>{
    const isOpen = openIndex === s.id;
    const badgeLabel = {pending:'Ausstehend', processing:'Wird bearbeitet…', done:'Fertig', error:'Fehler'}[s.status];
    const wordDelta = s.status==='done' ? `${s.wordsOriginal} → ${s.wordsAfter} Wörter (${Math.round((1-s.wordsAfter/s.wordsOriginal)*100)}%)` : `${s.wordsOriginal} Wörter`;
    return `
      <div class="item">
        <div class="item-head" data-id="${s.id}">
          <div>
            <div class="item-title">${escapeHtml(s.heading)}</div>
            <div class="item-meta chrome-font">${wordDelta} &middot; Ziel: ${escapeHtml(targetFor(s.heading))}</div>
          </div>
          <span class="badge ${s.status}">${badgeLabel}</span>
        </div>
        <div class="item-body ${isOpen?'open':''}">
          ${s.status==='error' ? `<p style="color:var(--error);font-family:'Inter',sans-serif;font-size:12.5px;">${escapeHtml(s.error)}</p>` : ''}
          ${s.status==='done' ? `
            <ul class="changes">${s.changes.map(c=>`<li>${escapeHtml(c)}</li>`).join('')}</ul>
            <div class="cols">
              <div class="col"><h4 class="chrome-font">Original</h4><div class="text-box">${escapeHtml(s.original)}</div></div>
              <div class="col"><h4 class="chrome-font">Überarbeitet</h4><div class="text-box">${escapeHtml(s.revised)}</div></div>
            </div>
          ` : `<div class="text-box" style="margin-top:12px;">${escapeHtml(s.original)}</div>`}
          <div class="row" style="margin-top:12px;">
            <button class="btn small ghost redo-btn" data-id="${s.id}" ${s.status==='processing'?'disabled':''}>${s.status==='done'?'Neu generieren':'Jetzt bearbeiten'}</button>
          </div>
        </div>
      </div>
    `;
  }).join('');

  list.querySelectorAll('.item-head').forEach(el=>{
    el.onclick = ()=>{
      const id = parseInt(el.getAttribute('data-id'));
      openIndex = openIndex === id ? null : id;
      render();
    };
  });
  list.querySelectorAll('.redo-btn').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const id = parseInt(el.getAttribute('data-id'));
      redoSection(id);
    };
  });

  footer.style.display = 'flex';
  footer.innerHTML = `
    <button class="btn" id="export-btn">Manuskript exportieren (.txt)</button>
    <p class="hint" style="margin:0;align-self:center;">Fertige Kapitel werden überarbeitet exportiert, offene/fehlerhafte im Original — damit nichts verloren geht.</p>
  `;
  document.getElementById('export-btn').onclick = exportManuscript;
}

// ---------- INIT ----------
(async function init(){
  await loadState();
  render();
})();

})();
</script>
</body>
</html>
