<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>A. J. Khan · EPUB Reader Test</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
  <style>
    :root{color-scheme:light;--bg:#171610;--paper:#fbf7ef;--ink:#2b241e;--rule:#877e6d;--gold:#d0ad64}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f2efe6}
    body{min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}
    .wrap{max-width:900px;margin:0 auto}
    h1{font-size:20px;font-weight:600;letter-spacing:.06em;margin:4px 0 8px}
    p{color:#c9c4b8;line-height:1.45;font-size:14px;margin:0 0 14px}
    .controls{display:grid;gap:10px;margin-bottom:12px}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    input,button{font:inherit}
    input{flex:1;min-width:180px;padding:12px;border:1px solid #5f5a50;background:#232119;color:#fff;border-radius:0}
    button{padding:11px 13px;border:1px solid #8f8778;background:transparent;color:#f2efe6;border-radius:0}
    button.active{background:#f2efe6;color:#171610}
    button:disabled{opacity:.45}
    .status{font-size:13px;min-height:20px;color:#d7c99e}
    #viewport{height:72vh;min-height:520px;background:var(--paper);overflow:hidden;border:1px solid #4d493f}
    #viewport iframe{background:var(--paper)!important}
    .nav{display:none;gap:8px;margin-top:10px}
    .nav button{flex:1}
    .note{font-size:12px;color:#9f988b;margin-top:10px}
    @media(max-width:600px){
      #viewport{height:70vh;min-height:500px}
      h1{font-size:17px}
      button,input{font-size:16px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>EPUB Reader Test · The Road it came by</h1>
  <p>Nur Testseite. Sie verändert weder EPUB noch Autorenseite.</p>
  <div class="controls">
    <div class="row">
      <input id="code" autocomplete="off" autocapitalize="characters" placeholder="Zugangscode">
      <button id="load">Buch laden</button>
    </div>
    <div class="row">
      <button data-mode="paginated">1 · Paginiert</button>
      <button data-mode="scrolled-doc">2 · Scrollen</button>
      <button data-mode="continuous">3 · Continuous</button>
    </div>
    <div class="status" id="status">Noch nicht geladen.</div>
  </div>
  <div id="viewport"></div>
  <div class="nav" id="nav">
    <button id="prev">← Vorherige Sektion</button>
    <button id="next">Nächste Sektion →</button>
  </div>
  <div class="note">Wenn ein Modus nach 10–15 Sekunden stabil bleibt, ist das unser Kandidat für die Produktivseite.</div>
</div>
<script>
(() => {
  'use strict';
  const GAS = 'https://script.google.com/macros/s/AKfycbwcbRDaWkM1wf3MV_dj4RPw9jQl2Fgc4YfGcmFrGU1S243yvh8WGW7mbyXLbSeVJKI/exec';
  const EPUB_URL = 'https://drive.google.com/uc?export=download&id=1kMKAXtEa_50k3Y8-3BpucLmRKMM6GFh0';
  const BOOK_TITLE = 'The Road it came by';
  const status = document.getElementById('status');
  const viewport = document.getElementById('viewport');
  const nav = document.getElementById('nav');
  let epubBytes = null;
  let book = null;
  let rendition = null;
  let currentMode = '';

  function say(s){ status.textContent = s; }
  function b64ToArrayBuffer(b64){
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    return arr.buffer;
  }
  async function fetchBook(){
    const code = document.getElementById('code').value.trim();
    if(!code){ say('Bitte Zugangscode eingeben.'); return false; }
    say('EPUB wird geladen …');
    const body = new URLSearchParams({
      action:'getEpubData',
      epubUrl:EPUB_URL,
      bookTitle:BOOK_TITLE,
      intent:'read',
      code
    });
    const res = await fetch(GAS,{method:'POST',body,cache:'no-store'});
    const data = await res.json();
    if(!data || !data.ok) throw new Error((data&&data.error)||'Backend-Fehler');
    epubBytes = b64ToArrayBuffer(data.dataBase64);
    say('EPUB geladen. Jetzt einen Modus wählen.');
    return true;
  }
  function destroy(){
    try{ if(rendition) rendition.destroy(); }catch(e){}
    try{ if(book) book.destroy(); }catch(e){}
    rendition=null; book=null; viewport.innerHTML='';
  }
  async function start(mode){
    if(!epubBytes){
      try{ if(!(await fetchBook())) return; }catch(e){ say('Laden fehlgeschlagen: '+e.message); return; }
    }
    destroy();
    currentMode = mode;
    document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
    nav.style.display = mode === 'paginated' ? 'flex' : 'none';
    say('Starte Modus: '+mode+' …');
    try{
      book = ePub(epubBytes.slice(0));
      let opts;
      if(mode==='paginated'){
        opts={width:'100%',height:'100%',manager:'default',flow:'paginated'};
      }else if(mode==='scrolled-doc'){
        opts={width:'100%',height:'100%',manager:'default',flow:'scrolled-doc'};
      }else{
        opts={width:'100%',height:'100%',manager:'continuous',flow:'scrolled'};
      }
      rendition = book.renderTo('viewport',opts);
      rendition.hooks.content.register(contents=>{
        try{
          const d=contents.document;
          const s=d.createElement('style');
          s.textContent='html,body{background:#fbf7ef!important;color:#2b241e!important;}';
          (d.head||d.documentElement).appendChild(s);
        }catch(e){}
      });
      rendition.on('rendered',()=>say('Gerendert: '+mode+' · bitte 15 Sekunden beobachten.'));
      rendition.on('relocated',loc=>{
        const idx=loc&&loc.start&&loc.start.index;
        if(Number.isFinite(idx)) say('Stabil? Modus '+mode+' · Spine '+idx);
      });
      await rendition.display();
    }catch(e){
      say('Render-Fehler: '+(e&&e.message?e.message:String(e)));
    }
  }

  document.getElementById('load').addEventListener('click', async()=>{
    try{ await fetchBook(); }catch(e){ say('Laden fehlgeschlagen: '+e.message); }
  });
  document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>start(btn.dataset.mode)));
  document.getElementById('prev').addEventListener('click',()=>{ try{ rendition&&rendition.prev(); }catch(e){} });
  document.getElementById('next').addEventListener('click',()=>{ try{ rendition&&rendition.next(); }catch(e){} });
})();
</script>
</body>
</html>
